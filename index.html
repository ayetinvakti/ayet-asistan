<html lang="tr">
<head>

    <title>Ayetin Vakti - Yapay Zeka Asistanı</title>

    <!-- Titremesiz Tema, Renk Hafızası ve Dil Entegrasyonu -->
    <script>
        // 1. Dil
        const savedLang = localStorage.getItem('user_lang') || 'tr';
        document.documentElement.lang = savedLang;
        if (savedLang === 'ar') document.documentElement.dir = 'rtl';

        // 2. Tema (ilk açılışta sistem teması)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
        }

        // 3. Özel renk paleti (yalnızca kaydedilen renkler uygulanır)
        function hexLum(hex) {
            hex = String(hex || '').trim().replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
            const ch = [0, 2, 4].map(i => {
                const v = parseInt(hex.substr(i, 2), 16) / 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
        }
        (function () {
            const root = document.documentElement.style;
            const bg = localStorage.getItem('custom_bg');
            const card = localStorage.getItem('custom_card');
            const text = localStorage.getItem('custom_text');
            const accent = localStorage.getItem('custom_accent');
            if (bg) root.setProperty('--bg-color', bg);
            if (card) root.setProperty('--chat-bg', card);
            if (text) root.setProperty('--text-color', text);
            // Özel arka plan var, yazı rengi seçilmemişse: okunabilir yazı rengi otomatik
            if (bg && !text) {
                const l = hexLum(bg);
                if (l !== null) root.setProperty('--text-color', l > 0.45 ? '#1e293b' : '#f8fafc');
            }
            if (accent) {
                root.setProperty('--primary-color', accent);
                root.setProperty('--user-msg-bg', accent);
                const l = hexLum(accent);
                if (l !== null) root.setProperty('--user-text-color', l > 0.45 ? '#0f172a' : '#ffffff');
            }
        })();
    </script>

    <style>

        .nav-btn {
            background: none; border: none; cursor: pointer; font-size: 1.25rem;
            color: var(--text-color); text-decoration: none;
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 50%; transition: background-color .2s ease;
        }
        .nav-btn:active { background-color: var(--bot-msg-bg); }

        }
        .message {
            max-width: 88%; padding: 10px 14px; border-radius: 12px;
            line-height: 1.5; font-size: .9rem; word-wrap: break-word; overflow-wrap: anywhere;
        }
        .message.bot { background-color: var(--bot-msg-bg); align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.user { background-color: var(--user-msg-bg); color: var(--user-text-color); align-self: flex-end; border-bottom-right-radius: 2px; }
        html[dir="rtl"] .message.bot { border-bottom-left-radius: 12px; border-bottom-right-radius: 2px; }
        html[dir="rtl"] .message.user { border-bottom-right-radius: 12px; border-bottom-left-radius: 2px; }

        /* Zengin cevap blokları */
        .b-h { font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
        .message p, .message .b-p { margin: 6px 0; }
        .message ul, .message ol { margin: 6px 0; padding-inline-start: 20px; }
        .message li { margin: 3px 0; }
        .b-note { margin-top: 8px; font-size: .8rem; opacity: .85; border-inline-start: 3px solid var(--primary-color); padding-inline-start: 8px; }
        .b-src { margin-top: 8px; font-size: .75rem; opacity: .75; }
        .tbl-wrap { overflow-x: auto; margin: 8px 0; }
        .message table { border-collapse: collapse; font-size: .8rem; min-width: 100%; }

        .message th { background: var(--chat-bg); }
        .ayah-card {
            margin: 8px 0; padding: 10px 12px; border-radius: 10px;
            background: var(--chat-bg); border: 1px solid var(--border-color);
            border-inline-start: 4px solid var(--primary-color);

        .ayah-ref { margin-top: 6px; font-size: .75rem; opacity: .75; }

        .link-btn {
            display: inline-block; padding: 6px 12px; border-radius: 14px; font-size: .8rem; text-decoration: none;

        }
        .chips-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .mini-chip {
            background: var(--chat-bg); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 5px 11px; border-radius: 14px; font-size: .78rem; cursor: pointer;
        }
        .mini-chip:active { opacity: .7; }
        .copy-btn { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--text-color); opacity: .6; margin-top: 6px; padding: 2px 0; }
        .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
        .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-color); opacity: .4; animation: blink 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay: .2s; }
        .typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: .9; } }

        .suggestions-container {
            display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;

        }
        .suggestion-chip:active { opacity: .7; transform: scale(.95); }

        .input-container {
            padding: 12px 16px; background-color: var(--chat-bg); border-top: 1px solid var(--border-color);

            flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            background-color: var(--bg-color); color: var(--text-color); font-size: 16px; outline: none; -webkit-appearance: none;

            background-color: var(--primary-color); color: var(--user-text-color);

        }
        .input-container button:disabled { opacity: .5; }
    </style>
</head>

function fold(s) {
  s = String(s).toLocaleLowerCase('tr');
  return s.replace(/[âäà]/g,'a').replace(/[îı]/g,'i').replace(/[ûü]/g,'u').replace(/ê/g,'e').replace(/ö/g,'o').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ş/g,'s')
          .replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}
function norm(s) {
  return fold(s).replace(/['’`ʼʻ‘]/g,'').replace(/[^a-z0-9\u0600-\u06FF:\-\/ ]+/g,' ').replace(/\s+/g,' ').trim();
}
// desenleri aynı harf eşlemesinden geçir (Arapça desenler için)
const rxFold = (r) => new RegExp(fold(r.source), r.flags);

// Sure adı eşleştirme tablosu (Türkçe adlar + servisten gelen İngilizce/Arapça adlar)
const SURAH_KEYS = [];   // {n, re}
function addSurahKey(n, name) {
  const letters = norm(name).replace(/[^a-z\u0600-\u06FF]/g, '');
  if (letters.length < 3) return;
  const body = letters.split('').join("[\\s\\-]*");
  SURAH_KEYS.push({ n, len: letters.length, re: new RegExp('(?:^|\\s)(' + body + ')(?=$|[\\s\\d:\\-\\/.,!?])') });
}
SURAH_TR.forEach((names, i) => names.split('|').forEach(nm => addSurahKey(i + 1, nm)));
let surahListLoaded = false;
async function ensureSurahList() {
  if (surahListLoaded) return;
  surahListLoaded = true;
  try {
    const r = await fetch(API + '/surah'); const j = await r.json();
    (j.data || []).forEach(s => {
      addSurahKey(s.number, String(s.name || '').replace(/^سورة\s*/, ''));
      const en = norm(s.englishName || '');
      addSurahKey(s.number, en);
      const stripped = en.replace(/^(al|an|ar|as|ash|at|az|ad|adh)[\s\-]+/, '');
      if (stripped !== en) addSurahKey(s.number, stripped);
    });
    SURAH_KEYS.sort((a, b) => b.len - a.len);
  } catch (e) { surahListLoaded = false; }
}
SURAH_KEYS.sort((a, b) => b.len - a.len);

// Mesaj içinden âyet referansı çıkar → {kind:'ayah', s, a, b} | {kind:'surah', s} | null
function parseRef(n) {
  if (/ayetel ?kursi|ayat ?(al|el)?[\s\-]?kursi|ayatul ?kursi|ayat ?al ?kursi|اية الكرسي|ايه الكرسي/.test(n)) return { kind: 'ayah', s: 2, a: 255, b: 255 };
  let m = n.match(/(?:^|\s)(\d{1,3})\s*[:\/]\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?(?=$|\s)/);
  if (m) return { kind: 'ayah', s: +m[1], a: +m[2], b: m[3] ? +m[3] : +m[2] };
  const hasSureWord = /\bsure|\bsurah|\bsura\b|سوره/.test(n);
  for (const k of SURAH_KEYS) {
    const mm = k.re.exec(n);
    if (!mm) continue;
    const end = mm.index + mm[0].length;
    const rest = n.slice(end);
    const after = rest.match(/^\s*(?:suresi\w*|sure\w*|surah|sura|سوره)?\s*[:.,]?\s*(?:ayet\w*|ayah|verse)?\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?(?=$|\s)/);
    if (after) return { kind: 'ayah', s: k.n, a: +after[1], b: after[2] ? +after[2] : +after[1] };
    const alone = n === mm[1].trim() || n === (mm[1].trim() + ' suresi') || n === ('surah ' + mm[1].trim()) || n === ('sure ' + mm[1].trim());
    if (hasSureWord || alone) return { kind: 'surah', s: k.n };
  }
  return null;
}

// ---- Canlı Kur'an servisi ----
async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error('http ' + r.status); const j = await r.json(); if (j.code !== 200) throw new Error('api ' + j.code); return j.data; }
async function fetchAyah(ref) {
  const eds = ['quran-uthmani'].concat(MEAL[lang] ? [MEAL[lang]] : []);
  const d = await jget(`${API}/ayah/${ref}/editions/${eds.join(',')}`);
  const ar = d.find(x => x.edition && x.edition.identifier === 'quran-uthmani') || d[0];
  const tr = MEAL[lang] ? d.find(x => x.edition && x.edition.identifier === MEAL[lang]) : null;
  return { ar: ar.text, tr: tr ? tr.text : '', s: ar.surah, n: ar.numberInSurah };
}
async function fetchSurahRange(sNo, from, to) {
  const eds = ['quran-uthmani'].concat(MEAL[lang] ? [MEAL[lang]] : []);
  const d = await jget(`${API}/surah/${sNo}/editions/${eds.join(',')}`);
  const ar = d[0], tr = d[1] || null;
  const out = [];
  for (let i = from - 1; i < Math.min(to, ar.ayahs.length); i++) out.push({ ar: ar.ayahs[i].text, tr: tr ? tr.ayahs[i].text : '', s: { number: ar.number, name: ar.name, englishName: ar.englishName }, n: ar.ayahs[i].numberInSurah });
  return { items: out, total: ar.ayahs.length };
}
function ayahBlock(a) {
  return ['ayah', { ar: a.ar, tr: a.tr, ref: `${a.s.englishName} (${a.s.name}) ${a.s.number}:${a.n}` }];
}

// ---- Rekât tablosu bloğu ----
function rekatBlocks(n) {
  let idx = REKAT.re.findIndex(r => rxFold(r).test(n));
  const rows = (idx >= 0 ? [idx] : [0,1,2,3,4]).map(i => [REKAT.names[lang][i]].concat(REKAT.rows[i]));
  const title = { tr: 'Vakit Namazlarının Rekât Sayıları', en: 'Rak‘ah Counts of the Daily Prayers', ar: 'عدد ركعات الصلوات اليومية' }[lang];
  return [['h', title], ['table', { head: REKAT.head[lang], rows }], ['note', REKAT.note[lang][0]], ['src', SREK]];
}

// ---- Anahtar kelime çıkarma (âyet arama) ----
const STOP = new Set(['ayet','ayeti','ayetler','ayetleri','ayetin','ilgili','hakkinda','hakkindaki','var','mi','mu','ara','bul','goster','getir','ver','bir','bana','kuran','kuranda','kurandan','de','da','ne','nedir','gecen','gecenler','kelime','kelimesi','sure','suresi','ve','icin','hangi','ile','olan','konusunda','lutfen',
  'verse','verses','ayah','ayat','about','on','quran','the','of','in','search','find','show','me','a','an','for','with','related','that','mention','mentions','regarding',
  'اية','ايه','ايات','آيات','عن','في','القران','قران','ابحث','اريد','عن','حول','من','هل']);
function extractKeyword(text) {
  const raw = text.toLocaleLowerCase('tr').replace(/^\s*(ara|ayet ara|search|بحث)\s*[:\-]\s*/, '');
  const toks = raw.split(/[^\p{L}\p{M}]+/u).filter(Boolean);
  const cands = toks.filter(t => !STOP.has(norm(t)) && t.length >= 3);
  if (!cands.length) return '';
  return cands.sort((a, b) => b.length - a.length)[0];
}
async function searchAyahs(kw) {
  const d = await jget(`${API}/search/${encodeURIComponent(kw)}/all/${SEARCH_ED[lang]}`);
  return d || { count: 0, matches: [] };
}

const CRISIS = /intihar|olmek istiyorum|kendime zarar|yasamak istemiyorum|kill myself|suicid|want to die|end my life|انتحار|اريد ان اموت|اقتل نفسي/;

const HELP = /neler yapabil|ne yapabil|yardim|nasil kullan|what can you|help me|how do you work|ماذا تستطيع|مساعده|ماذا يمكنك/;

function diyanetLinks() { return ['links', [{ label: T.openDiyanet + ' ↗', href: 'https://www.diyanet.gov.tr', ext: true }]]; }
function pageLinks(ids) { return ['links', ids.map(id => ({ label: PAGES[id].l[lang], href: SITE + (PAGES[id].repo ? PAGES[id].repo + '/' : '') }))]; }
function followChips(ids) { return ['chips', ids.map(id => ({ label: kbTitle(id), run: () => answerKb(id) }))]; }
function kbTitle(id) {
  if (id === 'rekat') return { tr: 'Rekât sayıları', en: 'Rak‘ah counts', ar: 'عدد الركعات' }[lang];
  const e = KB[id]; const h = (pick(e) || []).find(b => b[0] === 'h'); return h ? h[1] : id;
}

async function answerKb(id, rawNorm) {
  const e = KB[id];
  addUser(kbTitle(id));
  await botTurn(async () => kbReply(id, rawNorm || ''));
}
async function kbReply(id, n) {
  const e = KB[id];
  const blocks = id === 'rekat' ? rekatBlocks(n) : (pick(e) || []).slice();
  if (e.ayahs) {
    for (const ref of e.ayahs) {
      try { const a = await fetchAyah(ref); blocks.splice(blocks.length - 1, 0, ayahBlock(a)); } catch (x) { /* ayet kartı eklenemezse sessizce atla */ }
    }
  }
  if (e.pages) blocks.push(pageLinks(e.pages));
  if (e.follow) blocks.push(followChips(e.follow));
  return blocks;
}

async function route(text) {
  const n = norm(text);
  if (CRISIS.test(fold(text))) return T.crisis.slice().concat([['links', [{ label: '112 📞', href: 'tel:112', ext: true }]]]);
  if (n.length <= 28 && GREET.test(n) && !/\d/.test(n)) return [['p', T.greet], followChips(['farz32','namazfarz'])];
  if (THANKS.test(n)) return [['p', T.thanks]];
  if (HELP.test(n)) return T.help.slice();

  // 1) Doğrudan âyet/sure referansı
  await ensureSurahList();
  const ref = parseRef(n);
  if (ref) return await refReply(ref);

  // 2) Doğrulanmış bilgi bankası
  for (const id of Object.keys(KB)) {
    if (KB[id].re.some(r => rxFold(r).test(n))) return await kbReply(id, n);
  }
  // 3) Konu → âyet kartı (+ ilgili sayfa)
  for (const k of Object.keys(TOPIC_AYAH)) {
    const t = TOPIC_AYAH[k];
    if (t.re.some(r => rxFold(r).test(n))) {
      const blocks = [['p', t[lang]]];
      try { blocks.push(ayahBlock(await fetchAyah(t.ref))); blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]); } catch (x) { blocks.push(['note', T.err]); }
      if (t.page) blocks.push(pageLinks([t.page]));
      if (k !== 'huzur') blocks.push(['note', { tr: 'Ayrıntılı hükümler (miktar, şartlar vb.) için Diyanet’e başvur.', en: 'For detailed rulings (amounts, conditions, etc.) consult Diyanet.', ar: 'للأحكام التفصيلية (المقادير والشروط وغيرها) راجع الديانة.' }[lang]], diyanetLinks());
      return blocks;
    }
  }
  // 4) Site sayfaları
  for (const [id, r] of PAGE_RULES) {
    if (rxFold(r).test(n)) { const p = PAGES[id]; return [['p', p.d[lang]], pageLinks([id])]; }
  }
  // 5) Âyet arama
  if (/ayet|ayah|verse|quran|kuran|sure|^ara\s*[:\-]|^search\s*[:\-]|اية|ايه|ايات|القران|قران|بحث/.test(n)) {
    const kw = extractKeyword(text);
    if (kw) return await searchReply(kw);
  }
  // 6) Bilinmeyen → uydurma yok
  const kw = extractKeyword(text);
  const blocks = T.unknown.slice();
  blocks.push(diyanetLinks());
  if (kw) blocks.push(['chips', [{ label: T.searchChip(kw), run: () => runSearch(kw) }]]);
  blocks.push(followChips(['farz32','namazfarz','rekat']));
  return blocks;
}

async function refReply(ref) {
  try {
    if (ref.kind === 'surah') {
      const { items, total } = await fetchSurahRange(ref.s, 1, 10);
      const blocks = items.map(ayahBlock);
      if (total > items.length) blocks.push(['note', T.surahCut(total, items.length)]);
      blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
      blocks.push(pageLinks(['kuran']));
      return blocks;
    }
    if (ref.s < 1 || ref.s > 114 || ref.a < 1) return [['p', T.noAyah]];
    const to = Math.min(ref.b >= ref.a ? ref.b : ref.a, ref.a + 9);
    let items;
    if (to === ref.a) items = [await fetchAyah(`${ref.s}:${ref.a}`)];
    else items = (await fetchSurahRange(ref.s, ref.a, to)).items;
    if (!items.length) return [['p', T.noAyah]];
    const blocks = items.map(ayahBlock);
    blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
    blocks.push(pageLinks(['kuran']));
    return blocks;
  } catch (e) {
    return [['p', /http 404|api 404|api 400/.test(String(e)) ? T.noAyah : T.err], pageLinks(['kuran'])];
  }
}

async function searchReply(kw) {
  try {
    const res = await searchAyahs(kw);
    const all = res.matches || [];
    if (!all.length) return [['p', T.noSearch], pageLinks(['kuran'])];
    const top = all.slice(0, 5);
    const blocks = [['p', T.searched(kw, res.count || all.length, top.length)]];
    const arabic = await Promise.all(top.map(m => jget(`${API}/ayah/${m.surah.number}:${m.numberInSurah}/quran-uthmani`).catch(() => null)));
    top.forEach((m, i) => {
      const isArEd = SEARCH_ED[lang] === 'quran-simple';
      blocks.push(ayahBlock({ ar: arabic[i] ? arabic[i].text : (isArEd ? m.text : ''), tr: isArEd ? '' : m.text, s: m.surah, n: m.numberInSurah }));
    });
    blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
    blocks.push(['note', T.more]);
    blocks.push(pageLinks(['kuran']));
    return blocks;
  } catch (e) { return [['p', T.err], pageLinks(['kuran'])]; }
}
async function runSearch(kw) { addUser(T.searchChip(kw)); await botTurn(() => searchReply(kw)); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function rich(parent, text) {
  String(text).split(/(\*\*[^*]+\*\*)/).forEach(p => {
    if (/^\*\*.+\*\*$/.test(p)) parent.appendChild(el('strong', null, p.slice(2, -2)));
    else if (p) parent.appendChild(document.createTextNode(p));
  });
}
function renderBlocks(box, blocks) {
  let plain = [];
  blocks.forEach(b => {
    const [k, v] = b;
    if (k === 'h') { box.appendChild(el('div', 'b-h', v)); plain.push(v); }
    else if (k === 'p') { const p = el('div', 'b-p'); rich(p, v); box.appendChild(p); plain.push(v.replace(/\*\*/g, '')); }
    else if (k === 'ul' || k === 'ol') { const l = el(k); v.forEach((t, i) => { const li = el('li'); rich(li, t); l.appendChild(li); plain.push((k === 'ol' ? (i + 1) + '. ' : '• ') + t.replace(/\*\*/g, '')); }); box.appendChild(l); }
    else if (k === 'table') {
      const w = el('div', 'tbl-wrap'), t = el('table'), tr0 = el('tr');
      v.head.forEach(h => tr0.appendChild(el('th', null, h))); t.appendChild(tr0);
      v.rows.forEach(r => { const tr = el('tr'); r.forEach(c => tr.appendChild(el('td', null, c))); t.appendChild(tr); plain.push(r.join(' | ')); });
      w.appendChild(t); box.appendChild(w);
    }
    else if (k === 'note') { box.appendChild(el('div', 'b-note', v)); plain.push(v); }
    else if (k === 'src') { box.appendChild(el('div', 'b-src', '📚 ' + v)); plain.push(v); }
    else if (k === 'ayah') {
      const c = el('div', 'ayah-card');
      if (v.ar) c.appendChild(el('div', 'ayah-ar', v.ar));
      if (v.tr) c.appendChild(el('div', 'ayah-tr', v.tr));
      c.appendChild(el('div', 'ayah-ref', v.ref));
      box.appendChild(c); plain.push((v.ar ? v.ar + '\n' : '') + (v.tr ? v.tr + '\n' : '') + v.ref);
    }
    else if (k === 'links') {
      const row = el('div', 'links-row');
      v.forEach(l => { const a = el('a', 'link-btn', l.label); a.href = l.href; if (l.ext) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } row.appendChild(a); });
      box.appendChild(row);
    }
    else if (k === 'chips') {
      const row = el('div', 'chips-row');
      v.forEach(c => { const bt = el('button', 'mini-chip', c.label); bt.onclick = () => { if (!busy) { busy = true; Promise.resolve(c.run()).finally(() => { busy = false; setSend(); }); setSend(); } }; row.appendChild(bt); });
      box.appendChild(row);
    }
  });
  return plain.join('\n');
}
function setSend() { document.getElementById('send-btn').disabled = busy; }
function addUser(text) { const d = el('div', 'message user', text); chat().appendChild(d); d.scrollIntoView({ block: 'end' }); }
function addTyping() { const d = el('div', 'message bot'); const t = el('div', 'typing'); t.innerHTML = '<span></span><span></span><span></span>'; d.appendChild(t); chat().appendChild(d); d.scrollIntoView({ block: 'end' }); return d; }
function addBot(blocks) {
  const d = el('div', 'message bot');
  const plain = renderBlocks(d, blocks);
  const cb = el('button', 'copy-btn', T.copy);
  cb.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(plain) : Promise.reject()).then(() => { cb.textContent = T.copied; setTimeout(() => cb.textContent = T.copy, 1500); }).catch(() => {}); };
  d.appendChild(cb); chat().appendChild(d); d.scrollIntoView({ block: 'start' });
}
async function botTurn(fn) {
  const typing = addTyping();
  try { const blocks = await fn(); typing.remove(); addBot(blocks); }
  catch (e) { typing.remove(); addBot([['p', T.err]]); }
}
async function handleUser(text) {
  if (busy) return; busy = true; setSend();
  addUser(text);
  await botTurn(() => route(text));
  busy = false; setSend();
}
function sendMessage() { const i = document.getElementById('userInput'); const v = i.value.trim(); if (!v || busy) return; i.value = ''; handleUser(v); }
function sendSuggestion(q) { handleUser(q); }

function newChat() { chat().innerHTML = ''; addBot(T.welcome.slice()); }

// ---- Tema ----
function syncThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
  const m = document.getElementById('themeColorMeta'); if (m && bg) m.setAttribute('content', bg);
}
function updateThemeIcon() { document.getElementById('themeIcon').textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙'; }
function toggleTheme() {
  document.documentElement.classList.toggle('light-mode');
  localStorage.setItem('theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
  updateThemeIcon(); syncThemeColor();
}

function initUI() {
  document.title = T.docTitle;
  document.getElementById('header-title').textContent = T.headerTitle;
  const inp = document.getElementById('userInput'); inp.placeholder = T.ph;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
  document.getElementById('send-btn').textContent = T.send;
  document.getElementById('newChatBtn').title = T.newChat;
  const sc = document.getElementById('suggestionsContainer'); sc.innerHTML = '';
  T.chips.forEach(([label, q]) => { const b = el('button', 'suggestion-chip', label); b.onclick = () => sendSuggestion(q); sc.appendChild(b); });
  addBot(T.welcome.slice());
}
updateThemeIcon(); syncThemeColor(); initUI();
window.addEventListener('storage', () => { syncThemeColor(); });
    </script>
