    <!-- Titremesiz Tema, Renk Hafızası ve Dil Entegrasyonu -->
    <script>
        // 1. Dil
        const savedLang = localStorage.getItem('user_lang') || 'tr';
        document.documentElement.lang = savedLang;
        if (savedLang === 'ar') document.documentElement.dir = 'rtl';

        // 2. Tema (ilk açılışta sistem teması)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
        }

        // 3. Özel renk paleti (yalnızca kaydedilen renkler uygulanır)
        function hexLum(hex) {
            hex = String(hex || '').trim().replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
            const ch = [0, 2, 4].map(i => {
                const v = parseInt(hex.substr(i, 2), 16) / 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
        }
        (function () {
            const root = document.documentElement.style;
            const bg = localStorage.getItem('custom_bg');
            const card = localStorage.getItem('custom_card');
            const text = localStorage.getItem('custom_text');
            const accent = localStorage.getItem('custom_accent');
            if (bg) root.setProperty('--bg-color', bg);
            // Özel arka plan varsa tüm yüzeyler (üst çubuk, balonlar, kutular) mod rengi yerine ondan türetilir;
            // böylece açık modda bile koyu özel zeminde yazılar okunur kalır. Ayrı kart rengi seçilmişse o kullanılır.
            if (bg && !card) root.setProperty('--chat-bg', bg);
            if (card) root.setProperty('--chat-bg', card);
            if (text) root.setProperty('--text-color', text);
            // Özel arka plan var, yazı rengi seçilmemişse: okunabilir yazı rengi otomatik
            if (bg && !text) {
                const l = hexLum(bg);
                if (l !== null) root.setProperty('--text-color', l > 0.45 ? '#1e293b' : '#f8fafc');
            }
            if (bg || card) {
                root.setProperty('--bot-msg-bg', 'color-mix(in srgb, var(--text-color) 10%, ' + (card || bg) + ')');
                root.setProperty('--border-color', 'color-mix(in srgb, var(--text-color) 24%, transparent)');
                root.setProperty('--text-muted', 'color-mix(in srgb, var(--text-color) 68%, transparent)');
            }
            if (accent) {
                root.setProperty('--primary-color', accent);
                root.setProperty('--user-msg-bg', accent);
                const l = hexLum(accent);
                if (l !== null) root.setProperty('--user-text-color', l > 0.45 ? '#0f172a' : '#ffffff');
            }
        })();
    </script>

        .suggestion-chip {
            background-color: var(--bot-msg-bg); color: var(--text-color); border: 1px solid var(--border-color);

        .input-container {

    tr: [['h','Nâfile Namazlar'],['p','Nâfile; farz ve vâcip ibadetlerin dışında, daha fazla sevap kazanmak amacıyla yapılan ilâve ibadettir. Aşağıdaki nâfile namazlar hakkında bilgi verebilirim:'],['src','İslam İlmihali 1, TDV Yayınları (islamveihsan.com/nafile-namazlarin-kilinisi.html)']],
    en: [['h','Voluntary (Nāfile) Prayers'],['p','Nāfile prayers are additional acts of worship performed beyond the obligatory (fard) and wājib ones, in order to earn more reward. I can give information on these:'],['src','Based on İslam İlmihali 1, TDV Publications (islamveihsan.com)']],
    ar: [['h','صلوات النافلة'],['p','النافلة عبادة زائدة تُؤدّى بعد الفرائض والواجبات طلباً لمزيد من الثواب. ويمكنني إفادتك عن:'],['src','على ما ورد في «علم الحال الإسلامي 1» (TDV) (islamveihsan.com)']],

  teheccud: { re: [/teheccud|tehecud|teheccut|gece namaz|tahajjud|tahajud|qiyam al.?layl|قيام الليل|التهجد|صلاه الليل/],
    tr: [['h','Teheccüd Namazı'],['ul',['Yatsı namazından sonra bir miktar uyuyup kalkınca kılınan nâfile gece namazıdır','İki ile sekiz rekât arasında, çift sayıda kılınması tavsiye edilir; dileyen daha fazla da kılabilir','İki rekâtta bir selâm vermek daha faziletlidir; dört rekâtta bir selâm da verilebilir','Vakti, yatsıdan sonra uyuyup kalkmayı takiben imsak vaktine kadardır; geceleyin kalkamayacağından korkan kimse yatsıdan sonra, uyumadan önce de teheccüd niyetiyle kılabilir','Gece kalkacak kişi vitri teheccüdden sonra, gecenin son namazı olarak kılarsa daha faziletlidir']],['note','Farz değil, nâfile bir ibadettir.'],['src','sorularlaislamiyet.com (Yatsı, vitir ve teheccüd namazlarının vakitleri · Namaz konusunda en çok merak edilenler) · Diyanet kaynaklarına dayalı']],
    en: [['h','Tahajjud (Teheccüd) Prayer'],['ul',['A voluntary night prayer performed after sleeping for a while following the ʿishāʾ prayer and then waking up','It is recommended in even numbers of rak‘ahs, between two and eight; one may pray more if one wishes','Giving the salām after every two rak‘ahs is more virtuous; the salām may also be given after four rak‘ahs','Its time runs from waking up after ʿishāʾ until the imsak (dawn) time; someone who fears not waking up may pray it after ʿishāʾ, before sleeping, with the intention of tahajjud','It is more virtuous for one who will get up at night to pray witr after the tahajjud, as the last prayer of the night']],['note','It is a voluntary (nāfile) prayer, not an obligation.'],['src','sorularlaislamiyet.com (times of ʿishāʾ, witr and tahajjud · most asked questions on prayer) · Based on Diyanet sources']],
    ar: [['h','صلاة التهجد'],['ul',['صلاة نافلة تُؤدّى ليلاً بعد صلاة العشاء وبعد النوم قليلاً ثم القيام','يُستحب أداؤها شفعاً من ركعتين إلى ثماني ركعات، ولمن شاء الزيادة','التسليم بعد كل ركعتين أفضل، ويجوز التسليم بعد أربع ركعات','وقتها بعد القيام من النوم عقب العشاء إلى وقت الإمساك (الفجر)؛ ومن خشي ألا يستيقظ فله أداؤها بعد العشاء قبل النوم بنية التهجد','والأفضل لمن سيقوم في الليل أن يصلّي الوتر بعد التهجد ليكون آخر صلاة الليل']],['note','هي نافلة وليست فرضاً.'],['src','sorularlaislamiyet.com (أوقات العشاء والوتر والتهجد) · على ما ورد في مصادر الديانة']],
    pages: ['ogretmen'], follow: ['kusluk','tahiyye','vitir'] },
  kusluk: { re: [/kusluk|duha namaz|namaz\w* duha|duha (prayer|salah|rekat|vakti)|salat al.?duha|dhuha|صلاه الضحي/],
    tr: [['h','Kuşluk (Duhâ) Namazı'],['ul',['Kuşluk vaktinde kılınan, müstehap olan nâfile bir namazdır','Vakti, güneşin bir mızrak boyu yükselmesinden (doğuştan yaklaşık 45-50 dakika sonra) zeval (öğle) vaktine kadardır','İki, dört, sekiz veya on iki rekât kılınabilir; en faziletlisi sekiz rekâttır']],['src','İslam İlmihali 1, TDV Yayınları (islamveihsan.com/kusluk-duha-namazinin-kilinisi.html)']],
    en: [['h','Duha (Kuşluk) Prayer'],['ul',['A recommended (mustahab) voluntary prayer performed in the forenoon','Its time runs from when the sun has risen about a spear’s length (roughly 45–50 minutes after sunrise) until the zawāl (noon) time','It may be prayed as two, four, eight or twelve rak‘ahs; the most virtuous is eight rak‘ahs']],['src','Based on İslam İlmihali 1, TDV Publications (islamveihsan.com)']],
    ar: [['h','صلاة الضحى (الكُشلُك)'],['ul',['نافلة مستحبة تُؤدّى في وقت الضحى','وقتها من ارتفاع الشمس قدر رمح (نحو 45–50 دقيقة بعد الشروق) إلى وقت الزوال','تُصلّى ركعتين أو أربعاً أو ثمانياً أو اثنتي عشرة ركعة، والأفضل ثماني ركعات']],['src','على ما ورد في «علم الحال الإسلامي 1» (TDV) (islamveihsan.com)']],
    pages: ['ogretmen'], follow: ['teheccud','tahiyye','vitir'] },
  tahiyye: { re: [/tahiyye|mescid\w* selamla|(cami|mescid)\w* girince.*namaz|(cami|mescid)\w* girildiginde.*namaz|tahiyyat al.?masjid|greeting (of )?the (mosque|masjid)|prayer (when|upon) entering (a |the )?mosque|تحيه المسجد/],
    tr: [['h','Tahiyyetü’l-Mescid Namazı'],['ul',['Mescide/camiye girince oturmadan önce kılınan nâfile namazdır; hadiste mescide giren kişinin oturmadan önce iki rek‘at namaz kılması istenmiştir (Buhârî, Salât, 60)','Hükmü mendup (müstehap) olup özürsüz olarak kılmadan oturmak mekruhtur','Hanefîlere göre iki veya dört rekâttır','Kerâhet vakitlerinde kılınmaz','Farz veya başka bir namazı kılmak için mescide girip oturmadan o namaza başlayan kişi için bu namaz yerine geçer','Hanefî ve Mâlikîlere göre cuma günü hatip minberdeyken mescide giren kimse tahiyyetü’l-mescid kılmaz, oturup hutbeyi dinler (kılması mekruhtur)']],['note','Bu bilgi Hanefî mezhebine göredir; Şâfiî ve Hanbelîlerde, örneğin hutbe sırasında kısa ve en fazla iki rekât kılınır; bu niyetle istenen sayıda namaz da kılınabilir.'],['src','TDV İslâm Ansiklopedisi (Tahiyyetü’l-mescid md., F. Atar) · İslam İlmihali 1, TDV Yayınları (islamansiklopedisi.org.tr/tahiyyetul-mescid)']],
    en: [['h','Tahiyyat al-Masjid (Greeting the Mosque) Prayer'],['ul',['A voluntary prayer performed before sitting down upon entering a mosque; the hadith asks the one who enters a mosque to pray two rak‘ahs before sitting (Bukhārī, Ṣalāt, 60)','Its ruling is recommended (mandūb); sitting down without an excuse and without praying it is makrūh','According to the Hanafis it is two or four rak‘ahs','It is not prayed during the makrūh (disliked) times','If a person enters the mosque to pray a fard or another prayer and starts that prayer without sitting, it takes the place of this prayer','According to the Hanafis and Malikis, a person who enters while the khatib is on the minbar on Friday does not pray it but sits and listens to the khutbah (praying it is makrūh)']],['note','This follows the Hanafi school; in the Shafi‘i and Hanbali schools, e.g., during the khutbah it is prayed briefly and within two rak‘ahs, and otherwise any number of rak‘ahs may be prayed with this intention.'],['src','TDV Encyclopedia of Islam (Tahiyyat al-masjid, F. Atar) · Based on İslam İlmihali 1, TDV Publications']],
    ar: [['h','صلاة تحية المسجد'],['ul',['نافلة تُؤدّى عند دخول المسجد قبل الجلوس؛ وقد ورد في الحديث أن يصلّي الداخل إلى المسجد ركعتين قبل أن يجلس (البخاري، الصلاة، 60)','حكمها الندب، ويُكره الجلوس بلا عذر دون أدائها','وهي عند الحنفية ركعتان أو أربع','ولا تُؤدّى في الأوقات المكروهة','ومن دخل المسجد ليصلّي فريضة أو غيرها وبدأ بها دون أن يجلس أغنته عن تحية المسجد','وعند الحنفية والمالكية من دخل والخطيب على المنبر يوم الجمعة لا يصلّيها بل يجلس ويستمع الخطبة (ويُكره له أداؤها)']],['note','هذا على المذهب الحنفي؛ وعند الشافعية والحنابلة تُصلّى مثلاً أثناء الخطبة خفيفةً وفي حدود ركعتين، ويجوز غير ذلك أن يصلّي بهذه النية ما شاء من الركعات.'],['src','موسوعة الإسلام (TDV) (تحية المسجد، ف. آتار) · على ما ورد في «علم الحال الإسلامي 1»']],

  kurban: { re: [/kurban\w*.*(kes|vacip|farz|kimlere|nisap|sart|hayvan|yas\b|hisse)|(kimlere|nisap|sart|hisse).*kurban|udhiyah|udhiyya|udhiya|qurbani|animal sacrifice|الاضحيه|الاضاحي/],
    tr: [['h','Kurban İbadeti'],['ul',['Diyanet’e göre kurban, vâcip olan mâlî bir ibadettir','Yükümlü olanlar: akıllı, ergenlik çağına ermiş, seferî (yolcu) olmayan ve temel ihtiyaçları ile borçları dışında nisap miktarı (80,18 gr altın veya değerinde) mala sahip olan Müslümanlardır','Kurban kesmek yerine hayvanı ya da bedelini yoksullara sadaka olarak vermek kurban yerine geçmez','Kesim vakti, bayram namazı kılınan yerlerde bayram namazından sonra, kılınmayan yerlerde fecirden sonra başlar; Hanefîlere göre bayramın üçüncü günü akşamına kadar sürer','Kurban olarak yalnızca koyun, keçi, sığır, manda ve deve kesilebilir; kameri yıla göre asgari yaş: koyun ve keçi 1, sığır ve manda 2, deve 5; 6 ayını tamamlayan koyun, bir yaşını doldurmuş gibi iri ise kurban edilebilir','Koyun ve keçi bir kişi adına; deve, sığır ve manda en fazla yedi kişiye kadar ortaklaşa kesilebilir; hiçbir hisse yedide birden az olamaz','Belirgin derecede hasta, yürüyemeyecek kadar zayıf veya topal, bir ya da iki gözü kör, boynuzlarından biri veya ikisi kökünden kırık, kulaklarının veya memelerinin yarısı kesik, dişlerinin tamamı ya da çoğu dökük hayvanlar kurban edilemez']],['note','Bu bilgi Hanefî mezhebine göredir; örneğin Şâfiî mezhebinde kesim vakti bayramın dördüncü günü güneş batıncaya kadar sürer.'],['src','Diyanet İşleri Başkanlığı kurban bilgileri ve Din İşleri Yüksek Kurulu açıklamaları (islamveihsan.com/kurban-olacak-hayvanlar-kac-yasinda-olmalidir.html · kurban-kesim-vakti-ne-zaman-baslar-ve-biter.html · kurbanla-ilgili-sikca-sorulan-sorular.html)']],
    en: [['h','Qurbani (Udhiyah) Sacrifice'],['ul',['According to Diyanet, the sacrifice is a wājib act of worship involving wealth','Those obliged are Muslims who are sane, have reached puberty, are not travellers, and own wealth reaching the nisab (80.18 g of gold or its equivalent) beyond their basic needs and debts','Giving the animal or its value to the poor as charity instead of slaughtering does not count as the sacrifice','Slaughter time starts after the Eid prayer where the Eid prayer is held (after dawn where it is not held); according to the Hanafis it lasts until the evening of the third day of Eid','Only sheep, goats, cattle, buffalo and camels may be sacrificed; minimum age by the lunar year: sheep and goat 1, cattle and buffalo 2, camel 5; a sheep that has completed 6 months may be sacrificed if it looks as large as a one-year-old','A sheep or goat counts for one person; a camel, cow or buffalo for up to seven people, and no share may be less than one seventh','Animals that are clearly ill, too weak or lame to walk, blind in one or both eyes, with one or both horns broken at the root, with half of the ears or udder cut off, or with all or most teeth missing cannot be sacrificed']],['note','This follows the Hanafi school; e.g. in the Shafi‘i school the slaughter time lasts until sunset on the fourth day of Eid.'],['src','Diyanet Presidency sacrifice guidance and Religious Affairs High Council statements (islamveihsan.com)']],
    ar: [['h','الأضحية (القربان)'],['ul',['الأضحية عند الديانة عبادة مالية واجبة','يلزمها المسلم العاقل البالغ غير المسافر الذي يملك فوق حاجاته الأساسية وديونه ما بلغ النصاب (80.18 غراماً من الذهب أو ما يعادلها)','لا تقوم الصدقة بالحيوان أو بقيمته على الفقراء مقام الأضحية دون ذبح','يبدأ وقت الذبح بعد صلاة العيد حيث تُقام، وبعد طلوع الفجر حيث لا تُقام؛ وعند الحنفية يستمر إلى غروب اليوم الثالث من أيام العيد','لا يُضحّى إلا بالغنم والمعز والبقر والجاموس والإبل؛ والحد الأدنى للسن بالسنة القمرية: الضأن والمعز سنة، والبقر والجاموس سنتان، والإبل خمس سنوات؛ ويجوز الضأن الذي أتمّ ستة أشهر إن كان في هيئة ابن سنة','الشاة الواحدة عن شخص واحد؛ والبعير أو البقرة أو الجاموس عن سبعة أشخاص على الأكثر، ولا يقل نصيب أحدهم عن السُّبع','لا تجوز التضحية بما كان مريضاً بيّن المرض، أو ضعيفاً أو أعرج لا يمشي، أو أعمى في عين أو عينين، أو مكسور القرن من أصله، أو مقطوع نصف الأذن أو الضرع، أو ساقط كل الأسنان أو أكثرها']],['note','هذا على المذهب الحنفي؛ وعند الشافعية مثلاً يمتد وقت الذبح إلى غروب اليوم الرابع من العيد.'],['src','إرشادات رئاسة الشؤون الدينية (الديانة) ومجلس الشؤون الدينية الأعلى (islamveihsan.com)']],

  umre: { re: [/umre|umrah|عمره/],
    tr: [['h','Umre'],['ul',['Umre; ihrama girip tavaf ve sa‘y yaptıktan sonra tıraş olup (veya saçı kısaltıp) ihramdan çıkmaktır; belirli bir zamana bağlı değildir','Hanefî ve Mâlikîlere göre ömürde bir kez umre yapmak müekked sünnettir; Şâfiî ve Hanbelîlere göre farzdır','Hanefîlere göre umrenin farzları ihram (şart) ve tavaftır (rükün); sa‘y ile tıraş olmak (veya saçı kısaltmak) vâciptir','Tavaf, Hacer-i Esved köşesi hizasından başlayarak Kâbe’nin etrafında yapılan yedi dönüştür (şavt); sa‘y, Safâ ile Merve arasında dört gidiş ve üç geliştir','Yılın her zamanı yapılabilir; Hanefî mezhebinde yalnızca hac günlerinde, yani Arefe günü sabahından Kurban Bayramı’nın dördüncü günü akşamına kadar yapılması mekruhtur; diğer üç mezhebe göre o yıl hac yapmayan kimse için her zaman kerâhetsiz câizdir']],['note','Bu bilgi Hanefî mezhebine göredir; ayrıntılar için Diyanet Hac İlmihali’ne bak.'],['src','Diyanet Hac İlmihali · TDV İslâm Ansiklopedisi (islamveihsan.com/umre-nedir.html · umrenin-vacipleri-nelerdir.html · umre-nedir-nasil-yapilir.html · sorularlaislamiyet.com)']],
    en: [['h','Umrah'],['ul',['Umrah means entering ihram, performing tawaf and sa‘y, then shaving or trimming the hair and leaving ihram; it is not tied to a specific time','According to the Hanafis and Malikis, performing umrah once in a lifetime is a confirmed sunnah (sunnah mu’akkadah); according to the Shafi‘is and Hanbalis it is obligatory','According to the Hanafis its fards are ihram (a condition) and tawaf (a pillar); sa‘y and shaving or trimming the hair are wājib','Tawaf is seven circuits (shawt) around the Kaaba starting at the corner of the Black Stone; sa‘y is going between Safa and Marwa, four trips there and three trips back','It may be done at any time of the year; in the Hanafi school it is makrūh only during the hajj days, from the morning of Arafah until the evening of the fourth day of Eid al-Adha; according to the other three schools it is permissible without disapproval at any time for one who is not performing hajj that year']],['note','This follows the Hanafi school; for details see the Diyanet Hajj Ilmihal.'],['src','Diyanet Hajj Ilmihal · TDV Encyclopedia of Islam (islamveihsan.com · sorularlaislamiyet.com)']],
    ar: [['h','العمرة'],['ul',['العمرة: الإحرام ثم الطواف والسعي ثم الحلق أو التقصير والتحلل من الإحرام، ولا تتقيّد بوقت معيّن','هي عند الحنفية والمالكية سنة مؤكدة مرة في العمر، وعند الشافعية والحنابلة فرض','وفرضها عند الحنفية الإحرام (شرط) والطواف (ركن)؛ والسعي والحلق أو التقصير واجبان','الطواف سبعة أشواط حول الكعبة يبدأ من محاذاة الحجر الأسود؛ والسعي بين الصفا والمروة أربع ذهابات وثلاث إيابات','تُؤدّى في أي وقت من السنة؛ ويكرهها الحنفية فقط في أيام الحج من صباح عرفة إلى مساء اليوم الرابع من عيد الأضحى؛ وعند المذاهب الثلاثة الأخرى جائزة بلا كراهة في أي وقت لمن لم يحج في تلك السنة']],['note','هذا على المذهب الحنفي؛ وللتفاصيل راجع «علم حال الحج» للديانة.'],['src','«علم حال الحج» (الديانة) · موسوعة الإسلام (TDV) (islamveihsan.com · sorularlaislamiyet.com)']],
    pages: ['ilmihal'], follow: ['hac','kurban'] },
  zekatverilir: { re: [/zekat\w*.*(kimlere|kime |kimin|kimler|sarf)|kimlere.*zekat|kime.*zekat|(kardes|anne|baba|cocuk|esine|akraba|yakin|dede|nine|torun|gelin|damat|kayin|hala|teyze|amca|dayi)\w*.*zekat\w*.*veril|sekiz sinif|8 sinif|zakat.*(who (can|may|should)|recipients?|eligible|given to|to whom)|(recipients?|beneficiaries) of zakat|to whom.*zakat|who (can|may|should) (receive|get|take|be given)\b.*zakat|مصارف الزكاه|لمن تعطى الزكاه|لمن تدفع الزكاه|اصناف الزكاه/],
    tr: [['h','Zekât Kimlere Verilir?'],['p','Zekâtın verileceği sekiz sınıf Tevbe sûresi 60. âyette sayılmıştır:'],['ol',['Müslüman fakirler','Miskinler (düşkünler)','Zekât işinde çalışanlar','Kalpleri İslâm’a ısındırılmak istenenler','Köleler (özgürlüğüne kavuşturulacaklar)','Borçlular','Allah yolunda olanlar','Yolda kalmış yolcular']],['p','**Zekât verilemeyecekler (Hanefî mezhebi):**'],['ul',['Anne, baba, nine ve dedelere; çocuk ve torunlara','Eşe (karı koca birbirine zekât veremez)','Zengine, yani temel ihtiyaçları dışında nisap miktarı mala sahip olana; zengin babanın ergenlik çağına girmemiş çocuğuna','Müslüman olmayanlara','Hz. Peygamber’in yakınlarına','Zekât fakirin eline verilerek mülkiyetine geçirilmelidir; bu yüzden cami yapımı veya ölünün kefeni ve borçları için zekât verilmez']],['p','Bunların dışındaki yoksul akrabalara (kardeş, amca, teyze, dayı, hala ve çocukları) zekât verilebilir.'],['note',MEZHEP.tr],['src','Diyanet İslam İlmihali 1 · Diyanet Fetva Kurulu (islamveihsan.com/zekatin-verilecegi-sekiz-sinif.html · kimlere-zekat-verilmez.html · zekat-verilmeyen-kimseler.html · sorularlaislamiyet.com)']],
    en: [['h','To Whom Is Zakat Given?'],['p','The recipients of zakat are listed in verse 60 of Sūrat al-Tawbah, in eight categories:'],['ol',['Muslim poor','The needy','Those employed to collect zakat','Those whose hearts are to be won over to Islam','Slaves (to free them)','Debtors','Those in the cause of Allah','Stranded travellers']],['p','**Those to whom zakat may not be given (Hanafi school):**'],['ul',['Parents, grandparents, children and grandchildren','One’s spouse (spouses cannot give zakat to each other)','The wealthy, i.e. those who own the nisab beyond their basic needs, and the minor children of a wealthy father','Non-Muslims','The relatives of the Prophet','Zakat must be placed in the hands of the poor person; so it is not given for building a mosque, nor for a deceased person’s shroud or debts']],['p','Other poor relatives (siblings, paternal uncles, aunts, maternal uncles and their children) may be given zakat.'],['note',MEZHEP.en],['src','Diyanet İslam İlmihali 1 · Diyanet Fatwa Board (islamveihsan.com · sorularlaislamiyet.com)']],
    ar: [['h','لمن تُعطى الزكاة؟'],['p','مصارف الزكاة ثمانية أصناف ذُكرت في الآية 60 من سورة التوبة:'],['ol',['الفقراء المسلمون','المساكين','العاملون عليها (جباة الزكاة)','المؤلفة قلوبهم','الرقاب (العبيد)','الغارمون (المدينون)','في سبيل الله','ابن السبيل (المنقطع في سفره)']],['p','**من لا تُعطى لهم الزكاة (المذهب الحنفي):**'],['ul',['الوالدان والأجداد والجدّات، والأولاد وأولادهم','الزوج والزوجة (لا يعطي أحدهما الآخر زكاة)','الغني، أي من يملك النصاب فوق حاجاته الأساسية، والأولاد الصغار للأب الغني','غير المسلمين','أقارب النبي ﷺ','يجب تمليك الزكاة للفقير؛ فلا تُعطى لبناء مسجد ولا لكفن الميت وديونه']],['p','ويجوز إعطاء الزكاة لسائر الأقارب الفقراء (الإخوة والأعمام والعمّات والأخوال والخالات وأولادهم).'],['note',MEZHEP.ar],['src','«علم الحال الإسلامي 1» (الديانة) · هيئة الفتوى (islamveihsan.com · sorularlaislamiyet.com)']],
    ayahs: ['9:60'], pages: ['zekat'], follow: ['zekatnisap','fitre'] },
  hayiz: { re: [/hayiz|hayz|\bhayd\b|adet\w* ?(hali|hukum|kan|suresi|gunu|iken)|adetli|adet gor|regl|lohusa|nifas|ay hali|ayhali|istihaze|menstruat|menses|postpartum bleeding|postnatal bleeding|lochia|الحيض|حيض|النفاس|نفاس/],
    tr: [['h','Hayız, Nifas ve Özel Hâller'],['p','Hanefî mezhebine göre:'],['ul',['Hayız (âdet) en az 3, en çok 10 gün sürer; bundan az veya çok gelen kan hayız sayılmaz. İki hayız arasındaki en az temizlik süresi 15 gündür','Nifas (lohusalık), doğumdan sonra gelen kandır; en az süresi yoktur, en çok 40 gündür; kırk günü geçen kan istihâze (özür kanı) sayılır','Hayız ve nifas hâlinde namaz kılınmaz, oruç tutulmaz','Kılınmayan namazlar kaza edilmez; tutulmayan Ramazan oruçları temizlendikten sonra kaza edilir','Cinsel ilişkide bulunulmaz (Bakara 2/222); müçtehitlerin çoğunluğuna göre Kâbe tavaf edilmez; ibadet maksadıyla camiye girilmez, zorunlu ihtiyaç hâlinde girilebilir','Kur’an’a dokunma ve okuma konusunda bilginler farklı görüşler ortaya koymuştur; Hanefî ilmihâllerinde yasak sayılır, Kur’an’a bakmak ise câizdir','Temizlenen kadının gusül yapıp o vaktin namazını kılacak kadar zamanı varsa o namazı kaza etmesi gerekir; zaman yoksa kaza gerekmez']],['note','Bu bilgi Hanefî mezhebine göredir; Şâfiî mezhebinde süreler farklıdır (ör. hayız en az bir gün bir gece, en çok on beş gün; nifas en çok altmış gün).'],['src','Diyanet İslam İlmihali · Diyanet Fetva Kurulu (islamveihsan.com/kadinlarin-ozel-halleri.html · hayiz-ne-demektir-kisaca-anlami-nedir.html · adet-ve-lohusa-olan-kadinlara-haram-olan-seyler.html · sorularlaislamiyet.com)']],
    en: [['h','Menstruation, Postpartum Bleeding and Related Rulings'],['p','According to the Hanafi school:'],['ul',['Ḥayḍ (menstruation) lasts at least 3 and at most 10 days; bleeding shorter or longer than that is not ḥayḍ. The minimum period of purity between two menstruations is 15 days','Nifās (postpartum bleeding) is the blood after childbirth; it has no minimum limit and lasts at most 40 days; bleeding beyond forty days counts as istiḥāḍa (excuse bleeding)','During ḥayḍ and nifās, prayer is not performed and fasting is not observed','Missed prayers are not made up; missed Ramadan fasts are made up after becoming clean','Marital relations are not allowed (al-Baqarah 2:222); according to the majority of mujtahids tawaf of the Kaaba is not performed; one does not enter a mosque for worship, though entry is allowed in case of necessity','Scholars hold different views on touching and reciting the Qur’an; in Hanafi ilmihal works it is considered forbidden, while looking at the Qur’an is permissible','A woman who becomes clean and still has time to perform ghusl and pray that prayer within its time makes up that prayer; if there is not enough time, no make-up is required']],['note','This follows the Hanafi school; in the Shafi‘i school the durations differ (e.g. ḥayḍ at least one day and night and at most fifteen days; nifās at most sixty days).'],['src','Diyanet İslam İlmihali · Diyanet Fatwa Board (islamveihsan.com · sorularlaislamiyet.com)']],
    ar: [['h','الحيض والنفاس وأحكامهما'],['p','على المذهب الحنفي:'],['ul',['الحيض أقله ثلاثة أيام وأكثره عشرة أيام؛ وما نقص عن ذلك أو زاد فليس بحيض. وأقل طهر بين حيضتين خمسة عشر يوماً','النفاس هو الدم الخارج بعد الولادة؛ لا حدّ لأقله وأكثره أربعون يوماً، وما زاد على الأربعين استحاضة (دم عذر)','لا تُصلّي الحائض والنفساء ولا تصومان','لا تقضيان الصلاة التي فاتتهما، وتقضيان صيام رمضان بعد الطهر','لا يجوز الجماع (البقرة 2:222)، وعند جمهور المجتهدين لا يُطاف بالكعبة؛ ولا تدخلان المسجد للعبادة، ويجوز الدخول للضرورة','للعلماء آراء مختلفة في مسّ المصحف وقراءة القرآن؛ وهما محرمان في كتب علم الحال الحنفية، أما النظر إلى المصحف فجائز','من طهرت وبقي من الوقت ما يتسع للغسل وأداء تلك الصلاة قضتها، فإن لم يبق ما يكفي فلا قضاء']],['note','هذا على المذهب الحنفي؛ وعند الشافعية تختلف المدد (أقل الحيض يوم وليلة وأكثره خمسة عشر يوماً، وأكثر النفاس ستون يوماً).'],['src','«علم الحال الإسلامي» (الديانة) · هيئة الفتوى (islamveihsan.com · sorularlaislamiyet.com)']],
    ayahs: ['2:222'], pages: ['ilmihal'], follow: ['cunup','gusul','orucboz'] },
  cunup: { re: [/cunup|cenabet|cunuplu|janabah|janaba|junub|الجنابه|جنابه|للجنب|الجنب/],
    tr: [['h','Cünüplük (Cenâbet) Hükümleri'],['p','Cünüplük, gusül gerektiren büyük kirlilik (hades-i ekber) hâlidir; gusülle giderilir.'],['p','Gusül almadan önce cünüp kimseye şunlar yasaktır:'],['ul',['Namaz kılmak (farz veya nâfile) ve tilâvet secdesi yapmak','Kur’an okumak (tilâvet kastıyla); dua niyetiyle dua âyetlerini okumak câizdir','Kur’an’a el sürmek; elini sürmeden Kur’an’a bakmasında sakınca yoktur','Zorunlu bir durum olmadıkça camiye girmek veya içinden geçmek','Kâbe’yi tavaf etmek']],['p','Cünüp iken yemek, içmek ve uyumak haram değildir; ancak ibadetlere engel olduğu için gusül ilk fırsatta yapılmalıdır.'],['note',MEZHEP.tr],['src','Diyanet İslam İlmihali · TDV İslâm Ansiklopedisi (Cenâbet md.) (islamveihsan.com/cunup-olan-kimsenin-yapmasi-haram-olan-seyler.html · islamansiklopedisi.org.tr/cenabet)']],
    en: [['h','Janabah (Major Ritual Impurity)'],['p','Janabah is a state of major ritual impurity (ḥadath akbar) that requires ghusl; it is removed by ghusl.'],['p','Before performing ghusl, the following are forbidden for a person in janabah:'],['ul',['Performing prayer (obligatory or voluntary) or a prostration of recitation','Reciting the Qur’an with the intention of recitation; reciting supplication verses with the intention of supplication is permissible','Touching the Qur’an; there is no harm in looking at it without touching it','Entering a mosque or passing through it without necessity','Performing tawaf of the Kaaba']],['p','Eating, drinking and sleeping in this state are not forbidden, but ghusl should be performed at the first opportunity, since it prevents acts of worship.'],['note',MEZHEP.en],['src','Diyanet İslam İlmihali · TDV Encyclopedia of Islam (Janabah) (islamveihsan.com · islamansiklopedisi.org.tr)']],
    ar: [['h','الجنابة'],['p','الجنابة حدث أكبر يوجب الغسل، ويزول بالغسل.'],['p','يحرم على الجنب قبل الاغتسال:'],['ul',['الصلاة (فرضاً كانت أو نفلاً) وسجدة التلاوة','قراءة القرآن بقصد التلاوة؛ ويجوز قراءة آيات الدعاء بنية الدعاء','مسّ المصحف؛ ولا بأس بالنظر إليه دون مسّه','دخول المسجد أو المرور فيه بلا ضرورة','الطواف بالكعبة']],['p','ولا يحرم على الجنب الأكل والشرب والنوم، لكن ينبغي الاغتسال في أول فرصة لأن الجنابة تمنع العبادات.'],['note',MEZHEP.ar],['src','«علم الحال الإسلامي» (الديانة) · موسوعة الإسلام (TDV) (islamveihsan.com · islamansiklopedisi.org.tr)']],
    pages: ['ilmihal'], follow: ['gusul','guslugerek','teyemmum','hayiz'] },
  orucfarz: { re: [/oruc\w* (kimlere|kim |sart|farz|fidye|muaf|tutmayab|tutamay)|kimler oruc|fidye|fidya|who (must|has to) fast|(fasting|fast).*(obligat|exempt|who|fidya)|فديه|من يجب عليه الصيام|شروط الصيام|وجوب الصيام/],
    tr: [['h','Oruç Kimlere Farzdır?'],['ul',['Ramazan orucu, Müslüman ve akıl-bâliğ olan herkese farzdır','Hasta ve yolcu oruç tutmayabilir; tutmadığı günleri sonra kaza eder. Yolculukta esas, en az yaklaşık 90 km ve daha uzak bir yere gitmektir','İhtiyarlık veya iyileşme umudu olmayan hastalık gibi sürekli mazereti olanlar, tutamadıkları her gün için bir fakiri doyuracak fidye verir','Geçici mazeretle tutamayana fidye gerekmez, kaza eder. Mazeretsiz tutmayan da kaza eder ve tövbe istiğfar eder; hayız sebebiyle tutamayanlar sonradan kaza eder']],['note','Güncel fidye miktarını Diyanet her yıl açıklar; bunun için Diyanet’e başvur.'],['note',MEZHEP.tr],['src','Diyanet Din İşleri Yüksek Kurulu (AA, ntv.com.tr) · Diyanet ilmihali esaslı (islamveihsan.com, yenisafak.com)']],
    en: [['h','Who Must Fast?'],['ul',['Fasting in Ramadan is obligatory for every Muslim who is sane and has reached puberty','The sick and travellers may skip the fast and make up the missed days later. For travel, the criterion is a journey of about 90 km or more','Those with a permanent excuse, such as old age or an illness with no hope of recovery, give fidya for each day missed: feeding one poor person','Someone with a temporary excuse owes no fidya, only make-up days. Someone without an excuse also makes up the days and seeks repentance; women make up days missed due to menstruation']],['note','Diyanet announces the current fidya amount each year; consult Diyanet for it.'],['note',MEZHEP.en],['src','Diyanet Higher Board of Religious Affairs (via AA, ntv.com.tr) · Based on Diyanet ilmihal (islamveihsan.com, yenisafak.com)']],
    ar: [['h','على من يجب الصيام؟'],['ul',['صيام رمضان فرض على كل مسلم عاقل بالغ','للمريض والمسافر أن يفطرا ويقضيا الأيام لاحقاً. والمعيار في السفر مسافة نحو 90 كم فأكثر','من له عذر دائم كالشيخوخة أو مرض لا يُرجى برؤه يدفع فدية عن كل يوم: إطعام مسكين','من أفطر بعذر مؤقت لا فدية عليه بل القضاء. ومن أفطر بلا عذر يقضي ويتوب؛ والمرأة تقضي ما فاتها بسبب الحيض']],['note','تعلن الديانة مقدار الفدية كل عام؛ فراجعها لمعرفته.'],['note',MEZHEP.ar],['src','الهيئة العليا للشؤون الدينية (ntv.com.tr) · على ما ورد في علم الحال لدى الديانة (islamveihsan.com)']],
    pages: ['imsakiye'], follow: ['orucboz','sefer'] },
  hac: { re: [/\bhac\w*.*(farz|sart|kimlere)|kimlere.*\bhac|hajj.*(obligat|condition|requirement|who|fard)|who.*(must|has to|obliged).*hajj|شروط الحج|فرض الحج|وجوب الحج/],
    tr: [['h','Hac Kimlere Farzdır?'],['ul',['Ömürde bir kez farzdır; daha fazla yapılan hac nâfile olur','Farz olması için Müslüman, akıllı, ergenlik çağında ve hür olmak; borç ve aile fertlerinin ihtiyaçları dışında hacca gidip gelecek kadar mal ve imkâna sahip olmak; haccın yapılacağı vakte yetişmek gerekir','Haccın farz olması için zekât verecek konumda olmak şart değildir','Haccın sahih olması için ihrama girmek, vakfe, tavaf ve sa‘y gibi menâsiki belirlenen zaman ve yerlerde yapmak gerekir']],['note','Sağlık ve yol güvenliği gibi konularda mezhepler arasında farklı görüşler vardır; ayrıntı için Diyanet Hac İlmihali’ne başvur.'],['note',MEZHEP.tr],['src','Diyanet İslam İlmihali ve Hac İlmihali (islamveihsan.com/haccin-sartlari-nelerdir.html)']],
    en: [['h','Upon Whom Is Hajj Obligatory?'],['ul',['It is obligatory once in a lifetime; any further Hajj is voluntary','The conditions are being Muslim, sane, past puberty and free; having the means to go and return beyond debts and the needs of one’s family; and reaching the time when Hajj is performed','Being in a position to pay zakat is not a condition for Hajj to become obligatory','For the Hajj to be valid one must enter ihram and perform the rites such as wuquf, tawaf and sa‘y at the prescribed times and places']],['note','Schools differ on matters such as health and safety of the road; consult the Diyanet Hajj Ilmihal for details.'],['note',MEZHEP.en],['src','Diyanet İslam İlmihali and Hac İlmihali (islamveihsan.com)']],
    ar: [['h','على من يجب الحج؟'],['ul',['فرض مرة واحدة في العمر؛ وما زاد عليها فهو نافلة','شروط وجوبه: الإسلام والعقل والبلوغ والحرية؛ وملك ما يكفي للذهاب والعودة فاضلاً عن الدين وحاجات الأهل؛ وإدراك وقت أداء الحج','لا يُشترط لوجوب الحج أن يكون المرء ممن تجب عليهم الزكاة','ولصحة الحج يجب الإحرام وأداء المناسك كالوقوف والطواف والسعي في أوقاتها وأماكنها المحددة']],['note','تختلف المذاهب في أمور كالصحة وأمن الطريق؛ فراجع علم حال الحج لدى الديانة.'],['note',MEZHEP.ar],['src','علم الحال والحج لدى الديانة التركية (islamveihsan.com)']],
    pages: ['ilmihal'], follow: ['umre','kurban','zekatnisap'] },
  kaza: { re: [/kaza namaz|namaz\w*.*kaza|kaza.*namaz|missed prayers?|make.?up prayers?|qada.*(prayer|salah)|قضاء الصلاه|صلاه القضاء/],
    tr: [['h','Kaza Namazı'],['ul',['Vaktinde kılınamayan beş vakit farzın kazası farz, vitrin kazası vâciptir; sünnetler kural olarak kaza edilmez','Namaz vaktinde nasıl kılınıyorsa kazası da öyle kılınır; niyetin kaza diye yapılması ve kılınacak namazın belirlenmesi esastır','Kerahat vakitleri dışında her zaman kılınabilir; belirli bir süre yoktur','Kaç namazı kaldığını bilmeyen, galip kanaate göre hareket eder; karar veremezse borcundan kurtulduğuna kanaat getirinceye kadar kılar']],['note',MEZHEP.tr],['src','Diyanet (islamveihsan.com: Kazâ Namazı Nasıl Kılınır, Kaza Namazının Kılınışı)']],
    en: [['h','Make-up (Qada) Prayer'],['ul',['Missed obligatory prayers are made up as fard, and witr as wājib; sunnah prayers are not made up as a rule','A prayer is made up the way it would be prayed on time; the intention should be for qada and specify the prayer','It may be prayed at any time except the disliked (makrūh) times; there is no fixed deadline','Someone unsure how many prayers are owed acts on their best judgement; if undecided, they pray until confident the debt is cleared']],['note',MEZHEP.en],['src','Diyanet (islamveihsan.com: Kazâ Namazı Nasıl Kılınır, Kaza Namazının Kılınışı)']],
    ar: [['h','صلاة القضاء'],['ul',['قضاء الصلوات الخمس الفائتة فرض، وقضاء الوتر واجب؛ والسنن لا تُقضى في الأصل','تُقضى الصلاة كما تُؤدّى في وقتها؛ والأصل أن تكون النية للقضاء مع تعيين الصلاة','تجوز في أي وقت غير الأوقات المكروهة؛ ولا حدّ زمنياً لها','من لا يدري كم فاته عمل بغالب ظنه؛ فإن لم يترجح له شيء صلّى حتى يغلب على ظنه براءة ذمته']],['note',MEZHEP.ar],['src','الديانة التركية (islamveihsan.com)']],
    pages: ['ilmihal'], follow: ['sehiv','namazfarz'] },
  sehiv: { re: [/sehiv|sahiv|sajdah? al.?sahw|sujud al.?sahw|سجود السهو/],
    tr: [['h','Sehiv Secdesi'],['ul',['Namazda unutarak bir rüknü geciktirmek, tekrarlamak veya öne almak ya da bir vâcibi terk etmek, geciktirmek veya değiştirmek hâlinde sehiv secdesi yapmak vâciptir','Namazın son oturuşunda tahiyyât okunarak sağa selâm verilir, ara vermeden tekbirle secdeye varılır; secdede üç kez “Sübhâne rabbiye’l-a‘lâ” denir','Cemaatle kılınan namazda cemaatin yanlışlıkla dağılmaması için yalnız sağa selâm verip sehiv secdesi yapmak daha faziletlidir']],['note','Sehiv secdesinden sonraki tamamlama (tahiyyât, salavât, dualar, selâm) için İlmihal’e veya Diyanet’e başvur.'],['note',MEZHEP.tr],['src','Diyanet Din İşleri Yüksek Kurulu (yenisafak.com) · Diyanet Haber (islamveihsan.com)']],
    en: [['h','Prostration of Forgetfulness (Sahw)'],['ul',['If in prayer one forgetfully delays, repeats or advances a pillar, or omits, delays or changes a wājib, the prostration of forgetfulness is wājib','In the final sitting, recite the tashahhud, give the salām to the right only, then without pause say takbir and prostrate; say “Subhana rabbiyal-a‘la” three times in the prostration','In congregational prayer, giving the salām to the right only before the prostration is preferable, so that the congregation does not disperse by mistake']],['note','For how to complete the prayer afterwards (tashahhud, salawat, supplications, salām), consult the Ilmihal or Diyanet.'],['note',MEZHEP.en],['src','Diyanet Higher Board of Religious Affairs (yenisafak.com) · Diyanet Haber (islamveihsan.com)']],
    ar: [['h','سجود السهو'],['ul',['إذا أخّر المصلي ركناً سهواً أو كرّره أو قدّمه، أو ترك واجباً أو أخّره أو غيّره، وجب عليه سجود السهو','في القعدة الأخيرة يقرأ التشهد ويسلّم عن يمينه فقط، ثم يكبّر دون فاصل ويسجد؛ ويقول في السجود «سبحان ربي الأعلى» ثلاثاً','وفي صلاة الجماعة يُستحسن التسليم عن اليمين فقط قبل سجود السهو حتى لا تتفرق الجماعة خطأً']],['note','لإتمام الصلاة بعد ذلك (التشهد والصلاة على النبي والأدعية والتسليم) راجع علم الحال أو الديانة.'],['note',MEZHEP.ar],['src','الهيئة العليا للشؤون الدينية (yenisafak.com) · الديانة (islamveihsan.com)']],
    pages: ['ilmihal'], follow: ['kaza','namazfarz'] },
  zekatnisap: { re: [/zekat\w*.*(nisap|nisab|farz|sart|hesap|oran|verilmez)|nisap|nisab|zakat(?!.*fit).*(nisab|obligat|calculat|condition|rate|who must)|نصاب|زكاه.*(شروط|نصاب|فرض)/],
    tr: [['h','Zekât: Nisap ve Şartlar'],['ul',['Borcu ve temel ihtiyaçları dışında nisap miktarı mala sahip olan Müslümana, malın üzerinden bir kameri yıl geçince zekât farz olur; mal yıl başında ve yıl sonunda nisap miktarında olmalıdır','Nisap: altında 80,18 gr; para ve ticaret malında altın veya gümüş nisabı değerinde; hayvanlarda 5 deve, 30 sığır, 40 koyun veya keçi','Oran kırkta birdir (%2,5)','Ana, baba, dede, nine ile çocuk ve torunlara zekât verilmez; eşler birbirine veremez; nisap miktarı mala sahip olana da zekât verilmez']],['note','Zekâtın kimlere verileceğini “zekât kimlere verilir” diye sorabilirsin.'],['note',MEZHEP.tr],['src','Diyanet İslam İlmihali (islamveihsan.com/zekat-nasil-farz-olur.html)']],
    en: [['h','Zakat: Nisab and Conditions'],['ul',['Zakat becomes obligatory on a Muslim who owns the nisab beyond debts and basic needs once a lunar year has passed over it; the wealth must be at the nisab at both the start and end of the year','Nisab: 80.18 g of gold; for money and trade goods, the value of the gold or silver nisab; for animals, 5 camels, 30 cattle, 40 sheep or goats','The rate is one fortieth (2.5%)','Zakat is not given to parents, grandparents, children or grandchildren; spouses cannot give it to each other; nor to someone who owns the nisab']],['note','You can ask “who receives zakat” for its recipients.'],['note',MEZHEP.en],['src','Diyanet İslam İlmihali (islamveihsan.com: Zekât Nasıl Farz Olur?)']],
    ar: [['h','الزكاة: النصاب والشروط'],['ul',['تجب الزكاة على المسلم الذي يملك النصاب فاضلاً عن دينه وحاجاته الأصلية إذا مرّ على المال حول قمري؛ ويجب أن يكون المال نصاباً في أول الحول وآخره','النصاب: 80.18 غراماً من الذهب؛ وفي النقود وعروض التجارة ما يبلغ قيمة نصاب الذهب أو الفضة؛ وفي الأنعام 5 من الإبل و30 من البقر و40 من الغنم أو الماعز','المقدار ربع العشر (2.5%)','لا تُعطى الزكاة للوالدين والأجداد والأولاد والأحفاد؛ ولا يعطي الزوجان بعضهما؛ ولا لمن يملك النصاب']],['note','ولمعرفة مصارف الزكاة اسأل «لمن تُعطى الزكاة».'],['note',MEZHEP.ar],['src','علم الحال لدى الديانة التركية (islamveihsan.com)']],
    pages: ['zekat'], follow: ['zekatverilir','fitre','orucfarz'] },
  sefer: { re: [/(sefer|yolcu|yolculuk|musafir)\w*.*namaz|namaz.*(sefer|yolcu|yolculuk)|\bkasr|travel(l?er)?.*(prayer|salah)|(prayer|salah).*travel|shorten.*(prayer|salah)|qasr|صلاه المسافر|قصر الصلاه/],
    tr: [['h','Yolculukta (Seferî) Namaz'],['ul',['Yaklaşık 90 km ve üzeri bir yolculuğa çıkıp gittiği yerde 15 günden az kalmaya niyet eden kişi seferî sayılır','Seferî, dört rekâtlı farzları (öğle, ikindi, yatsı) iki rekât kılar; buna kasr denir','Sabah (2), akşam (3) ve vitir (3) olduğu gibi kılınır','Seferî mukim imama uyarsa namazı tam (dört rekât) kılar; mukim, seferî imama uyarsa imam selâm verince kalkıp namazını tamamlar']],['note','Bu bilgi Hanefî mezhebine göredir; Şâfiî mezhebinde seferîlik şartları ve kasrın hükmü farklıdır (ör. kalış süresi dört günle sınırlıdır, kasr yerine tam kılmak da câizdir).'],['src','islamveihsan.com/seferi-olmanin-sartlari-nelerdir.html · Diyanet ilmihali esaslı (sorularlaislamiyet.com, istiklal.com.tr)']],
    en: [['h','Prayer While Travelling'],['ul',['A person who sets out on a journey of about 90 km or more and intends to stay less than 15 days at the destination is considered a traveller','A traveller prays the four-rak‘ah fards (Dhuhr, Asr, Isha) as two rak‘ahs; this is called qasr','Fajr (2), Maghrib (3) and witr (3) are prayed as usual','A traveller following a resident imam prays the full four rak‘ahs; a resident following a travelling imam stands up after the imam’s salām and completes the prayer']],['note','This follows the Hanafi school; in the Shafi‘i school the conditions of travel and the ruling on qasr differ (e.g. the stay limit is four days, and praying in full is also permissible).'],['src','islamveihsan.com (Seferi olmanın şartları) · Based on Diyanet ilmihal (sorularlaislamiyet.com, istiklal.com.tr)']],
    ar: [['h','صلاة المسافر'],['ul',['من خرج في سفر مسافته نحو 90 كم فأكثر ونوى الإقامة في وجهته أقل من 15 يوماً عُدّ مسافراً','يصلّي المسافر الفرائض الرباعية (الظهر والعصر والعشاء) ركعتين، وهذا هو القصر','وتُصلّى الفجر (2) والمغرب (3) والوتر (3) كما هي','إن اقتدى المسافر بإمام مقيم أتمّ أربعاً؛ وإن اقتدى المقيم بإمام مسافر قام بعد سلام الإمام وأتمّ صلاته']],['note','هذا على المذهب الحنفي؛ وعند الشافعية تختلف شروط السفر وحكم القصر (كأن تكون مدة الإقامة أربعة أيام، ويجوز الإتمام أيضاً).'],['src','islamveihsan.com (شروط السفر) · على ما ورد في علم الحال لدى الديانة (sorularlaislamiyet.com)']],
    pages: ['ilmihal'], follow: ['rekat','namazfarz'] },
  fitre: { re: [/fitre|fitir|zakat al.?fitr|sadaqat al.?fitr|fitrah|زكاه الفطر|صدقه الفطر/],
    tr: [['h','Fıtır Sadakası (Fitre)'],['ul',['Hanefîlere göre borcu ve temel ihtiyaçları dışında nisap miktarı mala sahip her Müslümana vâciptir','Vâcip olma zamanı Ramazan Bayramı’nın birinci günüdür; bayramdan önce de verilebilir, bayram namazından önce vermek müstehaptır','Kişinin bakmakla yükümlü olmadığı yoksul Müslümanlara verilir; zekât verilemeyecek kimselere fitre de verilemez']],['note','Güncel fitre miktarını Diyanet her yıl açıklar; bunun için Diyanet’e başvur.'],['note','Şâfiî mezhebine göre fıtır sadakası farzdır ve yükümlü olmak için nisap miktarı mala sahip olmak şart değildir.'],['note',MEZHEP.tr],['src','Diyanet Din Hizmetleri Genel Müdürlüğü, Sadaka-i Fıtır (diyanet.gov.tr) · Diyanet Fetva Kurulu (islamveihsan.com)']],
    en: [['h','Zakat al-Fitr (Fitrah)'],['ul',['In the Hanafi school it is wājib on every Muslim who owns the nisab beyond debts and basic needs','It becomes due on the first day of Eid al-Fitr; it may be given before Eid, and giving it before the Eid prayer is mustahab','It is given to poor Muslims whom the giver is not obliged to support; it cannot be given to those who cannot receive zakat']],['note','Diyanet announces the current fitrah amount each year; consult Diyanet for it.'],['note','In the Shafi‘i school it is fard, and owning the nisab is not a condition.'],['note',MEZHEP.en],['src','Diyanet General Directorate of Religious Services, Sadaka-i Fıtır (diyanet.gov.tr) · Diyanet Fatwa Board (islamveihsan.com)']],
    ar: [['h','زكاة الفطر'],['ul',['هي واجبة عند الحنفية على كل مسلم يملك النصاب فاضلاً عن دينه وحاجاته الأصلية','وقت وجوبها أول يوم من عيد الفطر؛ ويجوز إخراجها قبل العيد، ويُستحب إخراجها قبل صلاة العيد','تُعطى للفقراء المسلمين ممن لا تلزم المزكّي نفقتهم؛ ولا تُعطى لمن لا تجوز له الزكاة']],['note','تعلن الديانة مقدار الفطرة كل عام؛ فراجعها لمعرفته.'],['note','وعند الشافعية هي فرض ولا يُشترط لوجوبها ملك النصاب.'],['note',MEZHEP.ar],['src','رئاسة الشؤون الدينية، صدقة الفطر (diyanet.gov.tr) · هيئة الفتوى (islamveihsan.com)']],
    pages: ['zekat','gunler'], follow: ['bayram'] },
  teravih: { re: [/teravih|tarawih|taraweeh|تراويح/],
    tr: [['h','Teravih Namazı'],['ul',['Ramazan ayına mahsus, yatsı namazından sonra ve vitirden önce kılınan nâfile bir namazdır','Erkek ve kadın her Müslüman için sünnet-i müekkededir; oruç tutamayan hasta ve yolcu için de sünnettir','Yirmi rekât olarak kılınır; ikişer rekâtta bir selâm vermek daha faziletlidir, dört rekâtta bir selâm vermek de câizdir']],['note','Diyanet, yirmi rekâtı kılmakta zorlananların (hasta, yorgun) sekiz rekât da kılabileceğini belirtir.'],['note',MEZHEP.tr],['src','TDV İslâm Ansiklopedisi (Teravih maddesi) · Diyanet ilmihali esaslı (cnnturk.com, sorularlaislamiyet.com)']],
    en: [['h','Tarawih Prayer'],['ul',['A voluntary prayer specific to Ramadan, prayed after the ʿishāʾ prayer and before witr','It is sunnah mu’akkadah for every Muslim, man or woman; it is sunnah also for the sick and travellers who cannot fast','It is prayed as twenty rak‘ahs; giving the salām after every two rak‘ahs is more virtuous, and after every four is also permissible']],['note','Diyanet states that those who find twenty rak‘ahs difficult (the sick, the tired) may pray eight.'],['note',MEZHEP.en],['src','TDV Encyclopedia of Islam (Teravih) · Based on Diyanet ilmihal (cnnturk.com, sorularlaislamiyet.com)']],
    ar: [['h','صلاة التراويح'],['ul',['نافلة خاصة برمضان تُصلّى بعد العشاء وقبل الوتر','سنة مؤكدة لكل مسلم رجلاً كان أو امرأة؛ وهي سنة أيضاً للمريض والمسافر الذين لا يصومون','تُصلّى عشرين ركعة؛ والتسليم بعد كل ركعتين أفضل، وبعد كل أربع جائز']],['note','تذكر الديانة أن من شقّ عليه أداء العشرين (المريض أو المتعب) يجوز له أداء ثماني ركعات.'],['note',MEZHEP.ar],['src','موسوعة الديانة الإسلامية (تراويح) · على ما ورد في علم الحال لدى الديانة (cnnturk.com)']],
    pages: ['imsakiye'], follow: ['vitir','rekat'] },
  bayram: { re: [/bayram\w* namaz|eid prayer|salat al.?eid|prayer of eid|صلاه العيد/],
    tr: [['h','Bayram Namazı'],['ul',['Ramazan ve Kurban bayramlarında kılınan iki rekâtlık namazdır; rekât sayısında âlimler ittifak etmiştir','Hanefîlere göre cuma namazı kendilerine farz olanlara vâciptir (Şâfiîlere göre sünnettir)','Her rekâtta üçer, toplam altı fazla (zevâid) tekbir vardır; Hanefîlerde bunlar vâciptir. Birinci rekâtta kıraatten önce, ikinci rekâtta kıraatten sonra alınır','Ezan ve kamet okunmaz; hutbe namazdan sonra okunur']],['note',MEZHEP.tr],['note','Şâfiî mezhebinde ilave tekbir sayısı farklıdır (birinci rekâtta yedi, ikincide beş).'],['src','TDV İslâm Ansiklopedisi (Rek‘at maddesi) · Diyanet ilmihali esaslı (fikriyat.com, sorularlaislamiyet.com)']],
    en: [['h','Eid Prayer'],['ul',['A two-rak‘ah prayer offered on Eid al-Fitr and Eid al-Adha; scholars agree on the number of rak‘ahs','In the Hanafi school it is wājib for those on whom the Friday prayer is obligatory (sunnah in the Shafi‘i school)','Each rak‘ah has three extra (zawā’id) takbirs, six in total; in the Hanafi school they are wājib. In the first rak‘ah they come before the recitation, in the second after it','There is no adhan or iqama; the khutbah is delivered after the prayer']],['note',MEZHEP.en],['note','In the Shafi‘i school the number of extra takbirs differs (seven in the first rak‘ah, five in the second).'],['src','TDV Encyclopedia of Islam (Rek‘at) · Based on Diyanet ilmihal (fikriyat.com, sorularlaislamiyet.com)']],
    ar: [['h','صلاة العيد'],['ul',['ركعتان تُصلّيان في عيد الفطر وعيد الأضحى؛ وقد اتفق العلماء على عدد ركعاتها','واجبة عند الحنفية على من تجب عليه الجمعة (وهي سنة عند الشافعية)','في كل ركعة ثلاث تكبيرات زائدة، فالمجموع ست؛ وهي واجبة عند الحنفية. تكون في الركعة الأولى قبل القراءة وفي الثانية بعدها','لا أذان ولا إقامة؛ والخطبة بعد الصلاة']],['note',MEZHEP.ar],['note','وعند الشافعية يختلف عدد التكبيرات الزائدة (سبع في الأولى وخمس في الثانية).'],['src','موسوعة الديانة الإسلامية (ركعة) · على ما ورد في علم الحال لدى الديانة (fikriyat.com)']],
    pages: ['gunler','ilmihal'], follow: ['cuma','rekat'] },
  cenaze: { re: [/cenaze|janazah|janaza|funeral prayer|صلاه الجنازه|الجنازه/],
    tr: [['h','Cenaze Namazı'],['ul',['Farz-ı kifâyedir','Ayakta kılınır; rükû ve secde yoktur. Rükünleri kıyam ve tekbirlerdir','Başlangıç tekbiriyle birlikte dört tekbir vardır; selâm vermek vâciptir','Abdest gereklidir; kerahat vakitlerinde kılınmaz']],['note','Okunacak dualar ve kılınış sırası için İlmihal sayfasına veya Diyanet’e başvur.'],['note',MEZHEP.tr],['src','Diyanet, İslam İlmihali (islamveihsan.com/cenaze-namazi-nasil-kilinir.html)']],

  namazboz: { re: [/namaz\w* (boz|bozan|bozulur)|what (breaks|invalidates) (the )?(prayer|salah|salat)|مبطلات الصلاه|يبطل الصلاه/],

    en: [['h','What Invalidates the Prayer (12)'],['ol',['Breaking wudu','Speaking in prayer','Excessive movement that makes it look as if one is not praying','Turning away from the Qibla','Eating or drinking','Coughing without excuse','Moaning, other than from humility','Laughing in prayer (in the Hanafi school even laughing audibly only to oneself; if others hear, wudu breaks too)','Sunrise during the dawn prayer','Zawal time beginning during the Eid prayer','Asr time entering during the Friday prayer','Certain involuntary situations']],['note',MEZHEP.en],['note','For details consult Diyanet.'],['src','Diyanet Encyclopedia of Islam (islamveihsan.com)']],
    ar: [['h','مبطلات الصلاة (12)'],['ol',['انتقاض الوضوء','الكلام في الصلاة','العمل الكثير','الانحراف عن القبلة','الأكل والشرب','التنحنح بلا عذر','الأنين لغير خشوع','الضحك في الصلاة (عند الحنفية ولو سمع نفسه فقط؛ وإن سمعه غيره انتقض الوضوء أيضاً)','طلوع الشمس أثناء صلاة الفجر','دخول وقت الزوال أثناء صلاة العيد','دخول وقت العصر أثناء صلاة الجمعة','بعض الأحوال القهرية']],['note',MEZHEP.ar],['note','للتفاصيل راجع الديانة.'],['src','موسوعة الديانة الإسلامية (islamveihsan.com)']],

    tr: [['h','Orucu Bozan Durumlar (temel hükümler)'],['ul',['Yemek, içmek ve cinsel ilişki orucu bozar','Ramazan günü oruçlu iken cinsel ilişki: hem kazâ hem kefâret gerektirir','Yolculuk, hastalık gibi meşrû bir mazerete dayalı olarak bozulan orucun yalnız kazâsı gerekir']],['note','Hangi durumların yalnız kazâ, hangilerinin kefâret gerektirdiği ve kefâretin nasıl ödeneceği gibi ayrıntılar için Diyanet’e başvur; burada yalnızca doğrulanmış temel hükümleri veriyorum.'],['note',MEZHEP.tr],['src','Diyanet İslam İlmihali 1. Cilt (sorularlaislamiyet.com) · Diyanet Fetva Kurulu (islamveihsan.com)']],
    en: [['h','What Breaks the Fast (core rulings)'],['ul',['Eating, drinking and sexual intercourse break the fast','Intercourse while fasting on a day of Ramadan requires both making up the day (qaḍā) and expiation (kaffārah)','A fast broken because of a legitimate excuse such as travel or illness requires only making up the day']],['note','For which cases need only qaḍā, which need kaffārah, and how it is paid, consult Diyanet; here I give only the verified core rulings.'],['note',MEZHEP.en],['src','Diyanet İslam İlmihali vol. 1 · Diyanet Fatwa Board']],
    ar: [['h','مفطرات الصوم (الأحكام الأساسية)'],['ul',['الأكل والشرب والجماع تفطّر','الجماع في نهار رمضان يوجب القضاء والكفارة معاً','ما أُفطر لعذر شرعي كالسفر والمرض ففيه القضاء فقط']],['note','لتفاصيل ما يوجب القضاء فقط وما يوجب الكفارة وكيفية أدائها راجع الديانة؛ أذكر هنا الأحكام الأساسية الموثقة فقط.'],['note',MEZHEP.ar],['src','علم الحال للديانة التركية · هيئة الفتوى']],

function fold(s) {
  s = String(s).toLocaleLowerCase('tr');
  return s.replace(/[âäà]/g,'a').replace(/[îı]/g,'i').replace(/[ûü]/g,'u').replace(/ê/g,'e').replace(/ö/g,'o').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ş/g,'s')
          .replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}
function norm(s) {
  return fold(s).replace(/['’`ʼʻ‘]/g,'').replace(/[^a-z0-9\u0600-\u06FF:\-\/ ]+/g,' ').replace(/\s+/g,' ').trim();
}

const SURAH_KEYS = [];   // {n, re}
function addSurahKey(n, name) {
  const letters = norm(name).replace(/[^a-z\u0600-\u06FF]/g, '');
  if (letters.length < 3) return;
  const body = letters.split('').join("[\\s\\-]*");
  SURAH_KEYS.push({ n, len: letters.length, re: new RegExp('(?:^|\\s)(' + body + ')(?=$|[\\s\\d:\\-\\/.,!?])') });
}

// Mesaj içinden âyet referansı çıkar → {kind:'ayah', s, a, b} | {kind:'surah', s} | null
function parseRef(n) {
  if (/ayetel ?kursi|ayat ?(al|el)?[\s\-]?kursi|ayatul ?kursi|ayat ?al ?kursi|اية الكرسي|ايه الكرسي/.test(n)) return { kind: 'ayah', s: 2, a: 255, b: 255 };
  let m = n.match(/(?:^|\s)(\d{1,3})\s*[:\/]\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?(?=$|\s)/);
  if (m) return { kind: 'ayah', s: +m[1], a: +m[2], b: m[3] ? +m[3] : +m[2] };
  const hasSureWord = /\bsure|\bsurah|\bsura\b|سوره/.test(n);
  for (const k of SURAH_KEYS) {
    const mm = k.re.exec(n);
    if (!mm) continue;
    const end = mm.index + mm[0].length;
    const rest = n.slice(end);
    const after = rest.match(/^\s*(?:suresi\w*|sure\w*|surah|sura|سوره)?\s*[:.,]?\s*(?:ayet\w*|ayah|verse)?\s*(\d{1,3})(?:\s*-\s*(\d{1,3}))?(?=$|\s)/);
    if (after) return { kind: 'ayah', s: k.n, a: +after[1], b: after[2] ? +after[2] : +after[1] };
    const alone = n === mm[1].trim() || n === (mm[1].trim() + ' suresi') || n === ('surah ' + mm[1].trim()) || n === ('sure ' + mm[1].trim());
    if (hasSureWord || alone) return { kind: 'surah', s: k.n };
  }
  return null;
}

async function jget(url) { const r = await fetch(url); if (!r.ok) throw new Error('http ' + r.status); const j = await r.json(); if (j.code !== 200) throw new Error('api ' + j.code); return j.data; }
async function fetchAyah(ref) {
  const eds = ['quran-uthmani'].concat(MEAL[lang] ? [MEAL[lang]] : []);
  const d = await jget(`${API}/ayah/${ref}/editions/${eds.join(',')}`);
  const ar = d.find(x => x.edition && x.edition.identifier === 'quran-uthmani') || d[0];
  const tr = MEAL[lang] ? d.find(x => x.edition && x.edition.identifier === MEAL[lang]) : null;
  return { ar: ar.text, tr: tr ? tr.text : '', s: ar.surah, n: ar.numberInSurah };
}
async function fetchSurahRange(sNo, from, to) {
  const eds = ['quran-uthmani'].concat(MEAL[lang] ? [MEAL[lang]] : []);
  const d = await jget(`${API}/surah/${sNo}/editions/${eds.join(',')}`);
  const ar = d[0], tr = d[1] || null;
  const out = [];
  for (let i = from - 1; i < Math.min(to, ar.ayahs.length); i++) out.push({ ar: ar.ayahs[i].text, tr: tr ? tr.ayahs[i].text : '', s: { number: ar.number, name: ar.name, englishName: ar.englishName }, n: ar.ayahs[i].numberInSurah });
  return { items: out, total: ar.ayahs.length };
}
function ayahBlock(a) {
  return ['ayah', { ar: a.ar, tr: a.tr, ref: `${a.s.englishName} (${a.s.name}) ${a.s.number}:${a.n}` }];
}

// ---- Rekât tablosu bloğu ----
function rekatBlocks(n) {
  let idx = REKAT.re.findIndex(r => rxFold(r).test(n));
  const rows = (idx >= 0 ? [idx] : [0,1,2,3,4]).map(i => [REKAT.names[lang][i]].concat(REKAT.rows[i]));
  const title = { tr: 'Vakit Namazlarının Rekât Sayıları', en: 'Rak‘ah Counts of the Daily Prayers', ar: 'عدد ركعات الصلوات اليومية' }[lang];
  return [['h', title], ['table', { head: REKAT.head[lang], rows }], ['note', REKAT.note[lang][0]], ['src', SREK]];
}

// ---- Anahtar kelime çıkarma (âyet arama) ----
const STOP = new Set(['ayet','ayeti','ayetler','ayetleri','ayetin','ilgili','hakkinda','hakkindaki','var','mi','mu','ara','bul','goster','getir','ver','bir','bana','kuran','kuranda','kurandan','de','da','ne','nedir','gecen','gecenler','kelime','kelimesi','sure','suresi','ve','icin','hangi','ile','olan','konusunda','lutfen',
  'verse','verses','ayah','ayat','about','on','quran','the','of','in','search','find','show','me','a','an','for','with','related','that','mention','mentions','regarding',
  'اية','ايه','ايات','آيات','عن','في','القران','قران','ابحث','اريد','عن','حول','من','هل']);
function extractKeyword(text) {
  const raw = text.toLocaleLowerCase('tr').replace(/^\s*(ara|ayet ara|search|بحث)\s*[:\-]\s*/, '');
  const toks = raw.split(/[^\p{L}\p{M}]+/u).filter(Boolean);
  const cands = toks.filter(t => !STOP.has(norm(t)) && t.length >= 3);
  if (!cands.length) return '';
  return cands.sort((a, b) => b.length - a.length)[0];
}
async function searchAyahs(kw) {
  const d = await jget(`${API}/search/${encodeURIComponent(kw)}/all/${SEARCH_ED[lang]}`);
  return d || { count: 0, matches: [] };
}

const GREET = /^(selam|selamun aleykum|selamunaleykum|merhaba|meraba|slm|hello|hi|hey|salam|assalamu alaikum|assalamu alaykum|as-?salamu alaykum|السلام عليكم|مرحبا|اهلا|سلام)\b/;

function diyanetLinks() { return ['links', [{ label: T.openDiyanet + ' ↗', href: 'https://www.diyanet.gov.tr', ext: true }]]; }
function pageLinks(ids) { return ['links', ids.map(id => ({ label: PAGES[id].l[lang], href: SITE + (PAGES[id].repo ? PAGES[id].repo + '/' : '') }))]; }
function followChips(ids) { return ['chips', ids.map(id => ({ label: kbTitle(id), run: () => answerKb(id) }))]; }

  if (id === 'rekat') return { tr: 'Rekât sayıları', en: 'Rak‘ah counts', ar: 'عدد الركعات' }[lang];

async function answerKb(id, rawNorm) {
  const e = KB[id];
  addUser(kbTitle(id));
  await botTurn(async () => kbReply(id, rawNorm || ''));
}
async function kbReply(id, n) {
  const e = KB[id];
  const blocks = id === 'rekat' ? rekatBlocks(n) : (pick(e) || []).slice();
  if (e.ayahs) {
    for (const ref of e.ayahs) {
      try { const a = await fetchAyah(ref); blocks.splice(blocks.length - 1, 0, ayahBlock(a)); } catch (x) { /* ayet kartı eklenemezse sessizce atla */ }
    }
  }
  if (e.pages) blocks.push(pageLinks(e.pages));
  if (e.follow) blocks.push(followChips(e.follow));
  return blocks;
}

function smallTalk(n) {
  for (const s of SMALL) {
    if (!rxFold(s.re).test(n)) continue;
    const t = s.f ? s.f()[lang] : rndOf(s[lang] || s.tr);
    return [['p', t]];
  }
  return null;
}

async function route(text) {
  const n = norm(text);
  if (CRISIS.test(fold(text))) return T.crisis.slice().concat([['links', [{ label: '112 📞', href: 'tel:112', ext: true }]]]);
  if (n.length <= 28 && GREET.test(n) && !/\d/.test(n)) return [['p', T.greet], followChips(['farz32','namazfarz'])];
  if (THANKS.test(n)) return [['p', T.thanks]];
  if (HELP.test(n)) return T.help.slice();
  const sm = smallTalk(n); if (sm) return sm;

  // 1) Doğrudan âyet/sure referansı
  await ensureSurahList();
  const ref = parseRef(n);
  if (ref) return await refReply(ref);

  // 2) Doğrulanmış bilgi bankası
  for (const id of Object.keys(KB)) {
    if (KB[id].re.some(r => rxFold(r).test(n))) return await kbReply(id, n);
  }
  // 3) Konu → âyet kartı (+ ilgili sayfa)
  for (const k of Object.keys(TOPIC_AYAH)) {
    const t = TOPIC_AYAH[k];
    if (t.re.some(r => rxFold(r).test(n))) {
      const blocks = [['p', t[lang]]];
      try { blocks.push(ayahBlock(await fetchAyah(t.ref))); blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]); } catch (x) { blocks.push(['note', T.err]); }
      if (t.page) blocks.push(pageLinks([t.page]));
      if (k !== 'huzur') blocks.push(['note', { tr: 'Ayrıntılı hükümler (miktar, şartlar vb.) için Diyanet’e başvur.', en: 'For detailed rulings (amounts, conditions, etc.) consult Diyanet.', ar: 'للأحكام التفصيلية (المقادير والشروط وغيرها) راجع الديانة.' }[lang]], diyanetLinks());
      return blocks;
    }
  }
  // 4) Site sayfaları
  for (const [id, r] of PAGE_RULES) {
    if (rxFold(r).test(n)) { const p = PAGES[id]; return [['p', p.d[lang]], pageLinks([id])]; }
  }
  // 5) Âyet arama
  if (/ayet|ayah|verse|quran|kuran|sure|^ara\s*[:\-]|^search\s*[:\-]|اية|ايه|ايات|القران|قران|بحث/.test(n)) {
    const kw = extractKeyword(text);
    if (kw) return await searchReply(kw);
  }
  // 6) Bilinmeyen → uydurma yok
  const kw = extractKeyword(text);
  const blocks = T.unknown.slice();
  blocks.push(diyanetLinks());
  if (kw) blocks.push(['chips', [{ label: T.searchChip(kw), run: () => runSearch(kw) }]]);
  blocks.push(followChips(['farz32','namazfarz','rekat']));
  return blocks;
}

async function refReply(ref) {
  try {
    if (ref.kind === 'surah') {
      const { items, total } = await fetchSurahRange(ref.s, 1, 10);
      const blocks = items.map(ayahBlock);
      if (total > items.length) blocks.push(['note', T.surahCut(total, items.length)]);
      blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
      blocks.push(pageLinks(['kuran']));
      return blocks;
    }
    if (ref.s < 1 || ref.s > 114 || ref.a < 1) return [['p', T.noAyah]];
    const to = Math.min(ref.b >= ref.a ? ref.b : ref.a, ref.a + 9);
    let items;
    if (to === ref.a) items = [await fetchAyah(`${ref.s}:${ref.a}`)];
    else items = (await fetchSurahRange(ref.s, ref.a, to)).items;
    if (!items.length) return [['p', T.noAyah]];
    const blocks = items.map(ayahBlock);
    blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
    blocks.push(pageLinks(['kuran']));
    return blocks;
  } catch (e) {
    return [['p', /http 404|api 404|api 400/.test(String(e)) ? T.noAyah : T.err], pageLinks(['kuran'])];
  }
}

async function searchReply(kw) {
  try {
    const res = await searchAyahs(kw);
    const all = res.matches || [];
    if (!all.length) return [['p', T.noSearch], pageLinks(['kuran'])];
    const top = all.slice(0, 5);
    const blocks = [['p', T.searched(kw, res.count || all.length, top.length)]];
    const arabic = await Promise.all(top.map(m => jget(`${API}/ayah/${m.surah.number}:${m.numberInSurah}/quran-uthmani`).catch(() => null)));
    top.forEach((m, i) => {
      const isArEd = SEARCH_ED[lang] === 'quran-simple';
      blocks.push(ayahBlock({ ar: arabic[i] ? arabic[i].text : (isArEd ? m.text : ''), tr: isArEd ? '' : m.text, s: m.surah, n: m.numberInSurah }));
    });
    blocks.push(['src', T.ayahSrc + ' · ' + MEAL_LABEL[lang]]);
    blocks.push(['note', T.more]);
    blocks.push(pageLinks(['kuran']));
    return blocks;
  } catch (e) { return [['p', T.err], pageLinks(['kuran'])]; }
}
async function runSearch(kw) { addUser(T.searchChip(kw)); await botTurn(() => searchReply(kw)); }

    }
    else if (k === 'links') {
      const row = el('div', 'links-row');
      v.forEach(l => { const a = el('a', 'link-btn', l.label); a.href = l.href; if (l.ext) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } row.appendChild(a); });
      box.appendChild(row);
    }
    else if (k === 'chips') {
      const row = el('div', 'chips-row');
      v.forEach(c => { const bt = el('button', 'mini-chip', c.label); bt.onclick = () => { if (!busy) { busy = true; Promise.resolve(c.run()).finally(() => { busy = false; setSend(); }); setSend(); } }; row.appendChild(bt); });
      box.appendChild(row);
    }
  });
  return plain.join('\n');
}
function setSend() { document.getElementById('send-btn').disabled = busy; }
function addUser(text) { const d = el('div', 'message user', text); chat().appendChild(d); d.scrollIntoView({ block: 'end' }); }
function addTyping() { const d = el('div', 'message bot'); const t = el('div', 'typing'); t.innerHTML = '<span></span><span></span><span></span>'; d.appendChild(t); chat().appendChild(d); d.scrollIntoView({ block: 'end' }); return d; }
function addBot(blocks) {
  const d = el('div', 'message bot');
  const plain = renderBlocks(d, blocks);
  const cb = el('button', 'copy-btn', T.copy);
  cb.onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(plain) : Promise.reject()).then(() => { cb.textContent = T.copied; setTimeout(() => cb.textContent = T.copy, 1500); }).catch(() => {}); };
  d.appendChild(cb); chat().appendChild(d); d.scrollIntoView({ block: 'start' });
}
async function botTurn(fn) {
  const typing = addTyping();
  try { const blocks = await fn(); typing.remove(); addBot(blocks); }
  catch (e) { typing.remove(); addBot([['p', T.err]]); }
}
async function handleUser(text) {
  if (busy) return; busy = true; setSend();
  addUser(text);
  await botTurn(() => route(text));
  busy = false; setSend();
}
function sendMessage() { const i = document.getElementById('userInput'); const v = i.value.trim(); if (!v || busy) return; i.value = ''; handleUser(v); }
function sendSuggestion(q) { handleUser(q); }

function newChat() { chat().innerHTML = ''; addBot(T.welcome.slice()); }

// ---- Tema ----
function syncThemeColor() {
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
  const m = document.getElementById('themeColorMeta'); if (m && bg) m.setAttribute('content', bg);
}
function updateThemeIcon() { document.getElementById('themeIcon').textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙'; }
function toggleTheme() {
  document.documentElement.classList.toggle('light-mode');
  localStorage.setItem('theme', document.documentElement.classList.contains('light-mode') ? 'light' : 'dark');
  updateThemeIcon(); syncThemeColor();
}

function initUI() {
  document.title = T.docTitle;
  document.getElementById('header-title').textContent = T.headerTitle;
  const inp = document.getElementById('userInput'); inp.placeholder = T.ph;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
  document.getElementById('send-btn').textContent = T.send;
  document.getElementById('newChatBtn').title = T.newChat;
  const sc = document.getElementById('suggestionsContainer'); sc.innerHTML = '';
  T.chips.forEach(([label, q]) => { const b = el('button', 'suggestion-chip', label); b.onclick = () => sendSuggestion(q); sc.appendChild(b); });
  addBot(T.welcome.slice());
}
updateThemeIcon(); syncThemeColor(); initUI();
window.addEventListener('storage', () => { syncThemeColor(); });
    </script>
</body>
</html>
