<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema ve Özel Renk Paleti Kontrolü
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--primary-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--chat-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Ayetin Vakti - Yapay Zeka Asistanı</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #10b981;
            --bot-msg-bg: #334155;
            --user-msg-bg: #10b981;
            --user-text-color: #ffffff;
            --border-color: #334155;
        }

        html.light-mode {
            --bg-color: #f8fafc;
            --chat-bg: #ffffff;
            --text-color: #0f172a;
            --primary-color: #0d9488;
            --bot-msg-bg: #f1f5f9;
            --user-msg-bg: #0d9488;
            --user-text-color: #ffffff;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        header { padding: 12px 16px; background-color: var(--chat-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        header h1 { font-size: 1rem; display: flex; align-items: center; gap: 8px; color: var(--primary-color); }
        .theme-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.9rem; word-wrap: break-word; }
        .message.bot { background-color: var(--bot-msg-bg); align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.user { background-color: var(--user-msg-bg); color: var(--user-text-color); align-self: flex-end; border-bottom-right-radius: 2px; }
        .suggestions-container { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background-color: var(--chat-bg); border-top: 1px solid var(--border-color); flex-shrink: 0; white-space: nowrap; }
        .suggestion-chip { background-color: var(--bot-msg-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
        .input-container { padding: 12px 16px; background-color: var(--chat-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; flex-shrink: 0; }
        .input-container input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--bg-color); color: var(--text-color); font-size: 0.95rem; outline: none; }
        .input-container button { background-color: var(--primary-color); color: white; border: none; padding: 0 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1 data-i18n="header_title">🤖 Vakit Asistanı</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">🌙</button>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot" data-i18n="welcome_msg">Selamün Aleyküm kardeşim! Ben Vakit Asistanı. Sana namaz vakitleri, oruç, abdest, sureler, dualar, zekat ve dini konulardaki tüm sorularında rehberlik etmeye hazırım.</div>
    </div>

    <div class="suggestions-container" id="suggestions">
        <button class="suggestion-chip" onclick="sendSuggestion('Namaz vakitleri nasıl hesaplanıyor?')">⏰ <span data-i18n="sug_namaz">Namaz Vakitleri</span></button>
        <button class="suggestion-chip" onclick="sendSuggestion('Abdest nasıl alınır?')">💧 <span data-i18n="sug_abdest">Abdest Nasıl Alınır?</span></button>
        <button class="suggestion-chip" onclick="sendSuggestion('Günün ayeti nedir?')">📖 <span data-i18n="sug_ayet">Günün Ayeti</span></button>
        <button class="suggestion-chip" onclick="sendSuggestion('Zekat kimlere verilir?')">🤲 <span data-i18n="sug_zekat">Zekat ve Sadaka</span></button>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" data-i18n_placeholder="input_placeholder" placeholder="Dini bir soru sorun ya da sohbet edin..." autocomplete="off" onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()" data-i18n="btn_send">Gönder</button>
    </div>

    <script>
        const translations = {
            tr: {
                page_title: "Ayetin Vakti - Yapay Zeka Asistanı",
                header_title: "🤖 Vakit Asistanı",
                welcome_msg: "Selamün Aleyküm kardeşim! Ben Vakit Asistanı. Sana dini konulardaki tüm sorularında rehberlik etmeye hazırım.",
                sug_namaz: "Namaz Vakitleri", sug_abdest: "Abdest", sug_ayet: "Günün Ayeti", sug_zekat: "Zekat",
                input_placeholder: "Dini bir soru sorun ya da sohbet edin...",
                btn_send: "Gönder"
            },
            en: {
                page_title: "Ayetin Vakti - AI Assistant",
                header_title: "🤖 Vakit Assistant",
                welcome_msg: "As-salamu alaykum! I am your Vakit Assistant. I am ready to guide you on all your religious questions.",
                sug_namaz: "Prayer Times", sug_abdest: "Wudu", sug_ayet: "Verse of the Day", sug_zekat: "Zakat",
                input_placeholder: "Ask a question or chat...",
                btn_send: "Send"
            },
            ar: {
                page_title: "آية الوقت - مساعد الذكاء الاصطناعي",
                header_title: "🤖 مساعد الوقت",
                welcome_msg: "السلام عليكم أخي! أنا مساعد الوقت. أنا جاهز لإرشادك في جميع أسئلتك الدينية.",
                sug_namaz: "أوقات الصلاة", sug_abdest: "الوضوء", sug_ayet: "آية اليوم", sug_zekat: "الزكاة",
                input_placeholder: "اطرح سؤالاً دينياً أو تحدث...",
                btn_send: "إرسال"
            }
        };

        const currentLang = localStorage.getItem('user_lang') || 'tr';

        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
        }

        // Dil ve Metin Uygulama
        document.addEventListener('DOMContentLoaded', () => {
            if (document.documentElement.classList.contains('light-mode')) document.getElementById('themeIcon').textContent = '🌙';
            else document.getElementById('themeIcon').textContent = '☀️';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
            const input = document.getElementById('userInput');
            input.placeholder = translations[currentLang].input_placeholder;
            if (currentLang === 'ar') document.body.style.direction = 'rtl';
        });

        // Sohbet Mantığı (Mevcut mantık korunmuştur)
        function appendMessage(text, sender) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function sendSuggestion(text) {
            appendMessage(text, 'user');
            // ... getBotResponse mantığı aynı kalacak
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            inputField.value = '';
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
